name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # THE REQUIRED GATE IS TWO JOBS SINCE 2026-09-21 (programme 017, T1701), AND THE SPLIT IS ABOUT
  # PostgreSQL. Until then `required-quality` was one Windows job running `verify_local.ps1` with
  # neither switch, and PostgreSQL ran only in the weekly `postgres` job - so a pull request could
  # be green while every advisory lock, `FOR UPDATE` and SERIALIZABLE retry in the money path went
  # unobserved (017 `spec.md`, Problem, defect 1). Service containers are not available to Windows
  # runners, so the backend half moved to ubuntu and took the PostgreSQL sessions of the deleted
  # `postgres` job with it; the UI half kept the Windows runner it had.
  required-backend:
    name: Required backend gates (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geov0_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U geo -d geov0_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Upgrade empty PostgreSQL database to the single migration head
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://geo:geo@127.0.0.1:5432/geov0_test_ci
        run: |
          python scripts/check_alembic_heads.py
          bash docker/docker-entrypoint.sh true

      # ONE PYTEST SESSION, THE WHOLE TIER, ON POSTGRESQL (017 stage 2c, T1702). Until then this job
      # ran three: the three-selector concurrency matrix and the `-BackendMarker postgres` tier, both
      # on PostgreSQL, and then the default tier on SQLite with no database environment at all.
      # Stage 2 moved the default tier to PostgreSQL and 2c removed the marker, so the three sessions
      # became one. Nothing is selected by file: the matrix's three tests are collected by the tier
      # like every other test, and `tooling-tests/portable/test_p017_required_gate_runs_on_postgres.py` names
      # them one by one and fails if the session could stop collecting any of them. The environment
      # is on the step, not the job, so the migration preflight above keeps its own.
      - name: Run the backend tier on PostgreSQL and the single Alembic head check
        shell: pwsh
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://geo:geo@127.0.0.1:5432/geov0_test_ci
          TEST_DATABASE_URL: postgresql+asyncpg://geo:geo@127.0.0.1:5432/geov0_test_ci
          GEO_TEST_ALLOW_DB_RESET: "1"
          GEO_TEST_USE_MIGRATED_SCHEMA: "1"
        run: >-
          ./scripts/verify_local.ps1
          -Python ((Get-Command python).Source)
          -TaskSlug ci-required-backend
          -BackendOnly

  required-ui:
    name: Required UI gates
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            admin-ui/package-lock.json
            simulator-ui/v2/package-lock.json

      # The UI half needs Python even though it runs no backend test: the PowerShell partition of the
      # tooling tier runs here (below). Until 2026-10-07 the Simulator UI v2 production build also
      # needed it - its prebuild ran the demo-snapshot generator - but 032 S4 (022 T2207) made the
      # snapshots static versioned assets and deleted the generator and the hook.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Both files: the tooling tier runs on pytest (requirements-dev.txt) and its workflow checks import
      # yaml, which arrives with uvicorn[standard] (requirements.txt).
      - name: Install Python dependencies for the tooling tier
        shell: pwsh
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # THE POWERSHELL PARTITION OF THE TOOLING TIER (025 T2502.2, 2026-10-03). The launcher checks
      # run once per PowerShell host they find, and this runner has both pwsh and Windows PowerShell;
      # they need no database, so they left the backend tier for the job that has the hosts. The
      # session counts its cases against tooling-tests/conftest.py. Blocking: no if, no
      # continue-on-error (tooling-tests/conftest.py, tooling_ci_binding_violations).
      - name: Run the tooling tier, PowerShell partition
        shell: pwsh
        run: >-
          ./scripts/verify_local.ps1
          -Python ((Get-Command python).Source)
          -TaskSlug ci-tooling-powershell
          -ToolingOnly
          -ToolingPartition powershell

      - name: Install Admin UI dependencies
        shell: pwsh
        run: npm --prefix admin-ui ci

      - name: Install Simulator UI v2 dependencies
        shell: pwsh
        run: npm --prefix simulator-ui/v2 ci

      - name: Run canonical required UI gates
        shell: pwsh
        run: >-
          ./scripts/verify_local.ps1
          -TaskSlug ci-required-ui
          -UiOnly

  static-diagnostics:
    name: Python static diagnostics (Ruff blocking, Black non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff diagnostics
        run: python -m ruff check app migrations --no-cache

      # THE PORTABLE PARTITION OF THE TOOLING TIER (025 T2502.2, 2026-10-03): the CI-form, document,
      # recipe and generator checks that need no database, moved out of the backend tier. It is a
      # BLOCKING step - the continue-on-error below belongs to the Black step alone and must never
      # be copied here (tooling-tests/conftest.py, tooling_ci_binding_violations).
      - name: Run the tooling tier, portable partition
        shell: pwsh
        run: >-
          ./scripts/verify_local.ps1
          -Python ((Get-Command python).Source)
          -TaskSlug ci-tooling-portable
          -ToolingOnly
          -ToolingPartition portable

      - name: Black diagnostics
        continue-on-error: true
        run: python -m black --check app migrations

  dev-image-content:
    name: Development image content policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_CONTEXT_IMAGE: geov0-dev-context:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Seed forbidden build-context sentinels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-run .venv node_modules admin-ui/node_modules
          : > .local-run/t502-sentinel.db
          : > .venv/t502-sentinel
          : > node_modules/t502-sentinel
          : > admin-ui/node_modules/t502-sentinel
          : > t502-root-sentinel.db

      - name: Build development image
        shell: bash
        run: docker build --file Dockerfile --target runtime --tag "$DEV_CONTEXT_IMAGE" .

      - name: Verify development image contents
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$DEV_CONTEXT_IMAGE" -ec '
            for forbidden in \
              /app/.local-run \
              /app/.venv \
              /app/node_modules \
              /app/admin-ui/node_modules \
              /app/t502-root-sentinel.db
            do
              if [ -e "$forbidden" ]; then
                echo "Forbidden build-context path found in image: $forbidden" >&2
                exit 1
              fi
            done

            found_node_modules="$(find /app -type d -name node_modules -print -quit)"
            if [ -n "$found_node_modules" ]; then
              echo "Forbidden node_modules directory found in image: $found_node_modules" >&2
              exit 1
            fi

            found_db="$(find /app -type f -name "*.db" -print -quit)"
            if [ -n "$found_db" ]; then
              echo "Forbidden database file found in image: $found_db" >&2
              exit 1
            fi
          '

      - name: Remove development image
        if: always()
        shell: bash
        run: docker image rm --force "$DEV_CONTEXT_IMAGE" || true

  # The `postgres` job stood here until 2026-09-21. It ran on the weekly schedule and on manual
  # dispatch only, and it owned both PostgreSQL pytest sessions. They moved into `required-backend`
  # above on 2026-09-21, and on 2026-09-23 (017 stage 2c) they and the default tier became ONE
  # session of the whole tier on PostgreSQL, with the same migration preflight through the
  # production entrypoint. Nothing of it was dropped; see
  # `tooling-tests/portable/test_p017_required_gate_runs_on_postgres.py`, which names the concurrency matrix's
  # three tests and fails if the tier goes back to a schedule-only job.
  container-smoke:
    name: Production-like container and schema smoke (scheduled/manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create task-local names and ephemeral secrets
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          db_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          admin_token="$(openssl rand -hex 32)"
          simulator_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' \
            "$db_password" "$jwt_secret" "$admin_token" "$simulator_secret"

          {
            echo "PHASE1_NETWORK=geov0-phase1-${suffix}"
            echo "PHASE1_POSTGRES=geov0-phase1-postgres-${suffix}"
            echo "PHASE1_APP=geov0-phase1-app-${suffix}"
            echo "PHASE1_IMAGE=geov0-phase1-container-smoke:${GITHUB_SHA}"
            echo "PHASE1_DB_PASSWORD=${db_password}"
            echo "PHASE1_JWT_SECRET=${jwt_secret}"
            echo "PHASE1_ADMIN_TOKEN=${admin_token}"
            echo "PHASE1_SIMULATOR_SECRET=${simulator_secret}"
          } >> "$GITHUB_ENV"

      - name: Build canonical production-like image
        shell: bash
        run: docker build --file docker/Dockerfile --tag "$PHASE1_IMAGE" .

      - name: Resolve the repository single Alembic head
        shell: bash
        run: |
          set -euo pipefail
          head_revision="$(docker run --rm --interactive \
            --entrypoint python \
            "$PHASE1_IMAGE" - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(
              Config("migrations/alembic.ini")
          ).get_heads()
          if len(heads) != 1:
              raise SystemExit(
                  f"Expected exactly one Alembic head, found {len(heads)}: {heads}"
              )
          print(heads[0])
          PY
          )"
          test -n "$head_revision"
          echo "PHASE1_ALEMBIC_HEAD=${head_revision}" >> "$GITHUB_ENV"
          echo "repository_alembic_head=${head_revision}"

      - name: Start disposable PostgreSQL and prepare revision 016 fixture
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$PHASE1_NETWORK"
          docker run --detach \
            --name "$PHASE1_POSTGRES" \
            --network "$PHASE1_NETWORK" \
            --env POSTGRES_USER=geo \
            --env "POSTGRES_PASSWORD=${PHASE1_DB_PASSWORD}" \
            --env POSTGRES_DB=geov0_test_phase1_empty \
            postgres:16-alpine

          for attempt in $(seq 1 30); do
            if docker exec "$PHASE1_POSTGRES" \
              pg_isready --host 127.0.0.1 --port 5432 \
              --username geo --dbname geov0_test_phase1_empty; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$PHASE1_POSTGRES"
              exit 1
            fi
            sleep 2
          done

          docker exec "$PHASE1_POSTGRES" \
            psql --set ON_ERROR_STOP=1 --username geo --dbname postgres \
            --command 'CREATE DATABASE geov0_test_phase1_from_016'
          docker exec "$PHASE1_POSTGRES" \
            psql --set ON_ERROR_STOP=1 --username geo \
            --dbname geov0_test_phase1_from_016 \
            --command 'CREATE TABLE alembic_version (version_num VARCHAR(128) NOT NULL PRIMARY KEY)'

          database_url="postgresql+asyncpg://geo:${PHASE1_DB_PASSWORD}@${PHASE1_POSTGRES}:5432/geov0_test_phase1_from_016"
          docker run --rm \
            --network "$PHASE1_NETWORK" \
            --entrypoint alembic \
            --env ENV=test \
            --env "DATABASE_URL=${database_url}" \
            "$PHASE1_IMAGE" \
            -c migrations/alembic.ini upgrade 016_debts_equivalent_debtor_index_and_no_self_loop

          revision="$(docker exec "$PHASE1_POSTGRES" \
            psql --tuples-only --no-align --username geo \
            --dbname geov0_test_phase1_from_016 \
            --command 'SELECT version_num FROM alembic_version')"
          test "$revision" = '016_debts_equivalent_debtor_index_and_no_self_loop'

          owner_columns="$(docker exec "$PHASE1_POSTGRES" \
            psql --tuples-only --no-align --username geo \
            --dbname geov0_test_phase1_from_016 \
            --command "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'simulator_runs' AND column_name IN ('owner_id', 'owner_kind')")"
          test "$owner_columns" = '0'
          echo "revision_016_fixture=${revision} owner_columns_before_017=${owner_columns}"

          docker exec "$PHASE1_POSTGRES" \
            psql --set ON_ERROR_STOP=1 --username geo \
            --dbname geov0_test_phase1_from_016 \
            --command "INSERT INTO simulator_runs (run_id, scenario_id, mode, state) VALUES ('phase1-legacy-run', 'phase1-fixture', 'fixtures', 'stopped')"

      - name: Boot empty database, verify health and schema, then stop gracefully
        shell: bash
        run: |
          set -euo pipefail

          database_url="postgresql+asyncpg://geo:${PHASE1_DB_PASSWORD}@${PHASE1_POSTGRES}:5432/geov0_test_phase1_empty"
          docker run --detach \
            --name "$PHASE1_APP" \
            --network "$PHASE1_NETWORK" \
            --publish 127.0.0.1:18080:8000 \
            --env ENV=prod \
            --env "DATABASE_URL=${database_url}" \
            --env REDIS_ENABLED=false \
            --env "JWT_SECRET=${PHASE1_JWT_SECRET}" \
            --env "ADMIN_TOKEN=${PHASE1_ADMIN_TOKEN}" \
            --env "SIMULATOR_SESSION_SECRET=${PHASE1_SIMULATOR_SECRET}" \
            --env SIMULATOR_CSRF_ORIGIN_ALLOWLIST=https://simulator.phase1.invalid \
            --env "GEO_APP_VERSION=${GITHUB_SHA}" \
            --env "PHASE1_ALEMBIC_HEAD=${PHASE1_ALEMBIC_HEAD}" \
            "$PHASE1_IMAGE"

          for attempt in $(seq 1 60); do
            if liveness="$(curl --silent --show-error --fail http://127.0.0.1:18080/healthz)" && \
              readiness="$(curl --silent --show-error --fail http://127.0.0.1:18080/health)" && \
              database_health="$(curl --silent --show-error --fail http://127.0.0.1:18080/health/db)" && \
              LIVENESS_JSON="$liveness" READINESS_JSON="$readiness" DB_HEALTH_JSON="$database_health" \
              python -c 'import json, os; assert json.loads(os.environ["LIVENESS_JSON"])["status"] == "ok"; assert json.loads(os.environ["READINESS_JSON"])["status"] == "ok"; db = json.loads(os.environ["DB_HEALTH_JSON"]); assert db["status"] == "ok" and db["db"]["reachable"] is True'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$PHASE1_APP"
              exit 1
            fi
            sleep 2
          done

          docker exec -i "$PHASE1_APP" python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import inspect, text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.db.models.simulator_storage import SimulatorRun
          from app.config import settings


          async def main() -> None:
              engine = create_async_engine(settings.DATABASE_URL)
              try:
                  async with engine.connect() as connection:
                      revision = (await connection.execute(text(
                          "SELECT version_num FROM alembic_version"
                      ))).scalar_one()
                      columns = await connection.run_sync(
                          lambda sync_connection: inspect(sync_connection).get_columns(
                              "simulator_runs"
                          )
                      )
                      indexes = await connection.run_sync(
                          lambda sync_connection: inspect(sync_connection).get_indexes(
                              "simulator_runs"
                          )
                      )
              finally:
                  await engine.dispose()

              expected_head = os.environ["PHASE1_ALEMBIC_HEAD"]
              assert revision == expected_head, (
                  f"empty database revision {revision!r} != repository head "
                  f"{expected_head!r}"
              )
              actual_columns = {column["name"]: column for column in columns}
              model = SimulatorRun.__table__
              assert actual_columns["owner_id"]["nullable"] is model.c.owner_id.nullable is False
              assert actual_columns["owner_kind"]["nullable"] is model.c.owner_kind.nullable is True

              actual_index = next(
                  index
                  for index in indexes
                  if index["name"] == "ix_simulator_runs_owner_state_created"
              )
              expected_index = next(
                  index
                  for index in model.indexes
                  if index.name == "ix_simulator_runs_owner_state_created"
              )
              assert actual_index["column_names"] == [
                  column.name for column in expected_index.columns
              ]
              print(
                  "empty_database_schema=ok "
                  f"revision={revision} "
                  f"owner_id_nullable={actual_columns['owner_id']['nullable']} "
                  f"owner_kind_nullable={actual_columns['owner_kind']['nullable']} "
                  f"owner_index={actual_index['column_names']}"
              )


          asyncio.run(main())
          PY

          docker stop --time 30 "$PHASE1_APP"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$PHASE1_APP")"
          docker logs "$PHASE1_APP"
          test "$exit_code" = '0'
          echo "empty_database_graceful_exit=${exit_code}"
          docker rm "$PHASE1_APP"

      - name: Restart the migrated empty-database topology and stop gracefully
        shell: bash
        run: |
          set -euo pipefail

          database_url="postgresql+asyncpg://geo:${PHASE1_DB_PASSWORD}@${PHASE1_POSTGRES}:5432/geov0_test_phase1_empty"
          docker run --detach \
            --name "$PHASE1_APP" \
            --network "$PHASE1_NETWORK" \
            --publish 127.0.0.1:18080:8000 \
            --env ENV=prod \
            --env "DATABASE_URL=${database_url}" \
            --env REDIS_ENABLED=false \
            --env "JWT_SECRET=${PHASE1_JWT_SECRET}" \
            --env "ADMIN_TOKEN=${PHASE1_ADMIN_TOKEN}" \
            --env "SIMULATOR_SESSION_SECRET=${PHASE1_SIMULATOR_SECRET}" \
            --env SIMULATOR_CSRF_ORIGIN_ALLOWLIST=https://simulator.phase1.invalid \
            --env "GEO_APP_VERSION=${GITHUB_SHA}" \
            --env "PHASE1_ALEMBIC_HEAD=${PHASE1_ALEMBIC_HEAD}" \
            "$PHASE1_IMAGE"

          for attempt in $(seq 1 60); do
            if readiness="$(curl --silent --show-error --fail http://127.0.0.1:18080/health)" && \
              READINESS_JSON="$readiness" \
              python -c 'import json, os; assert json.loads(os.environ["READINESS_JSON"])["status"] == "ok"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$PHASE1_APP"
              exit 1
            fi
            sleep 2
          done

          docker stop --time 30 "$PHASE1_APP"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$PHASE1_APP")"
          docker logs "$PHASE1_APP"
          test "$exit_code" = '0'
          echo "repeat_start_graceful_exit=${exit_code}"
          docker rm "$PHASE1_APP"

      - name: Upgrade revision 016 fixture through the canonical entrypoint
        shell: bash
        run: |
          set -euo pipefail

          database_url="postgresql+asyncpg://geo:${PHASE1_DB_PASSWORD}@${PHASE1_POSTGRES}:5432/geov0_test_phase1_from_016"
          docker run --detach \
            --name "$PHASE1_APP" \
            --network "$PHASE1_NETWORK" \
            --publish 127.0.0.1:18080:8000 \
            --env ENV=prod \
            --env "DATABASE_URL=${database_url}" \
            --env REDIS_ENABLED=false \
            --env "JWT_SECRET=${PHASE1_JWT_SECRET}" \
            --env "ADMIN_TOKEN=${PHASE1_ADMIN_TOKEN}" \
            --env "SIMULATOR_SESSION_SECRET=${PHASE1_SIMULATOR_SECRET}" \
            --env SIMULATOR_CSRF_ORIGIN_ALLOWLIST=https://simulator.phase1.invalid \
            --env "GEO_APP_VERSION=${GITHUB_SHA}" \
            --env "PHASE1_ALEMBIC_HEAD=${PHASE1_ALEMBIC_HEAD}" \
            "$PHASE1_IMAGE"

          for attempt in $(seq 1 60); do
            if readiness="$(curl --silent --show-error --fail http://127.0.0.1:18080/health)" && \
              database_health="$(curl --silent --show-error --fail http://127.0.0.1:18080/health/db)" && \
              READINESS_JSON="$readiness" DB_HEALTH_JSON="$database_health" \
              python -c 'import json, os; assert json.loads(os.environ["READINESS_JSON"])["status"] == "ok"; db = json.loads(os.environ["DB_HEALTH_JSON"]); assert db["status"] == "ok" and db["db"]["reachable"] is True'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$PHASE1_APP"
              exit 1
            fi
            sleep 2
          done

          docker exec -i "$PHASE1_APP" python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import inspect, text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.db.models.simulator_storage import SimulatorRun
          from app.config import settings


          async def main() -> None:
              engine = create_async_engine(settings.DATABASE_URL)
              try:
                  async with engine.connect() as connection:
                      revision = (await connection.execute(text(
                          "SELECT version_num FROM alembic_version"
                      ))).scalar_one()
                      columns = await connection.run_sync(
                          lambda sync_connection: inspect(sync_connection).get_columns(
                              "simulator_runs"
                          )
                      )
                      indexes = await connection.run_sync(
                          lambda sync_connection: inspect(sync_connection).get_indexes(
                              "simulator_runs"
                          )
                      )
                      legacy = (await connection.execute(text(
                          "SELECT owner_id, owner_kind FROM simulator_runs "
                          "WHERE run_id = 'phase1-legacy-run'"
                      ))).one()
              finally:
                  await engine.dispose()

              expected_head = os.environ["PHASE1_ALEMBIC_HEAD"]
              assert revision == expected_head, (
                  f"016 upgrade revision {revision!r} != repository head "
                  f"{expected_head!r}"
              )
              actual_columns = {column["name"]: column for column in columns}
              model = SimulatorRun.__table__
              assert actual_columns["owner_id"]["nullable"] is model.c.owner_id.nullable is False
              assert actual_columns["owner_kind"]["nullable"] is model.c.owner_kind.nullable is True

              actual_index = next(
                  index
                  for index in indexes
                  if index["name"] == "ix_simulator_runs_owner_state_created"
              )
              expected_index = next(
                  index
                  for index in model.indexes
                  if index.name == "ix_simulator_runs_owner_state_created"
              )
              assert actual_index["column_names"] == [
                  column.name for column in expected_index.columns
              ]
              assert legacy.owner_id == "legacy:unknown"
              assert legacy.owner_kind is None
              print(
                  "upgrade_016_to_head_schema=ok "
                  f"revision={revision} "
                  f"owner_id_nullable={actual_columns['owner_id']['nullable']} "
                  f"owner_kind_nullable={actual_columns['owner_kind']['nullable']} "
                  f"owner_index={actual_index['column_names']} "
                  f"legacy_owner_id={legacy.owner_id} "
                  f"legacy_owner_kind={legacy.owner_kind}"
              )


          asyncio.run(main())
          PY

          docker stop --time 30 "$PHASE1_APP"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$PHASE1_APP")"
          docker logs "$PHASE1_APP"
          test "$exit_code" = '0'
          echo "upgrade_016_graceful_exit=${exit_code}"
          docker rm "$PHASE1_APP"

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs "$PHASE1_APP" 2>&1 || true
          docker logs "$PHASE1_POSTGRES" 2>&1 || true

      - name: Remove disposable containers and network
        if: always()
        shell: bash
        run: |
          docker rm --force "$PHASE1_APP" 2>/dev/null || true
          docker rm --force "$PHASE1_POSTGRES" 2>/dev/null || true
          docker network rm "$PHASE1_NETWORK" 2>/dev/null || true

  # THE ADMIN SMOKE RUNS AGAINST A REAL BACKEND SINCE 2026-10-07 (032 S4). The Admin UI lost its mock
  # mode, so the job got what `required-backend` has - a `postgres:16` service and Python - plus the
  # sequence of `scripts/verify_admin_e2e.ps1`: migrate, seed `riverside-town-50` through the recipe,
  # start uvicorn, wait for /health. The smoke asserts a participant of the seed, so a backend that is
  # down or a database that is empty fails it (`admin-ui/e2e/participants.spec.ts`).
  ui-smoke:
    name: Active UI Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geov0_dev_ci-admin-e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U geo -d geov0_dev_ci-admin-e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://geo:geo@127.0.0.1:5432/geov0_dev_ci-admin-e2e
      ADMIN_E2E_BACKEND_ORIGIN: http://127.0.0.1:18141

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      # The same sequence as scripts/verify_admin_e2e.ps1: the service container created the empty
      # database, named geov0_dev_<slug> because the seed refuses any other name (scripts/seed_recipe.py);
      # migrate it with the one migration entry, then seed riverside-town-50 through the recipe
      # (operations through the domain services, ending in a reconciliation).
      - name: Migrate and seed the Admin e2e database
        run: |
          python -m alembic -c migrations/alembic.ini upgrade head
          python scripts/seed_db.py --source recipe --community riverside-town-50

      # A disposable token per run, so nothing secret is written into the workflow.
      - name: Start the backend and wait for /health
        run: |
          token="admin-e2e-$(python -c 'import secrets; print(secrets.token_hex(32))')"
          jwt="admin-e2e-jwt-$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$token"
          echo "ADMIN_E2E_TOKEN=$token" >> "$GITHUB_ENV"
          ADMIN_TOKEN="$token" JWT_SECRET="$jwt" nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18141 > "$RUNNER_TEMP/admin-e2e-backend.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "$ADMIN_E2E_BACKEND_ORIGIN/health" > /dev/null; then echo "Backend readiness: true"; exit 0; fi
            sleep 1
          done
          echo "Backend readiness: false"
          cat "$RUNNER_TEMP/admin-e2e-backend.log"
          exit 1

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            admin-ui/package-lock.json
            simulator-ui/v2/package-lock.json

      - name: Install Admin UI dependencies
        run: npm --prefix admin-ui ci

      - name: Install Simulator UI v2 dependencies
        run: npm --prefix simulator-ui/v2 ci

      - name: Install Admin UI pinned Chromium and OS dependencies
        run: npm --prefix admin-ui exec -- playwright install --with-deps chromium

      - name: Install Simulator UI v2 pinned Chromium
        run: npm --prefix simulator-ui/v2 exec -- playwright install chromium

      - name: Run Admin UI smoke on its isolated port
        env:
          PW_E2E_PORT: "41731"
        run: npm --prefix admin-ui run test:e2e:smoke

      - name: Run Simulator UI v2 smoke on its isolated port
        env:
          PW_E2E_PORT: "41732"
        run: npm --prefix simulator-ui/v2 run test:e2e:smoke

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/admin-e2e-backend.log" || true

  # ON POSTGRESQL SINCE 2026-10-04 (programme 028, F-028-8). Until then this job ran on
  # `windows-latest`, which has no service containers, and pytest exited `4` on arrival (run
  # `36374399886`: the test tier refuses a missing or SQLite URL since 017 stage 2c). It now has
  # the same ubuntu runner and `postgres:16` service as `required-backend`; the database name is
  # derived by `verify_local.ps1` from the task slug (`geov0_test_ci-super-smoke`), which is why no
  # URL or reset opt-in is set here. The three stands (part1-3) measured green on PostgreSQL 16
  # after programme 027 (`3 passed`, five runs, 028 Changelog 2026-10-04). Known and not hidden:
  # `simulator_runs.seed` is still `Integer` while the seed is 32 unsigned bits (F-028-1, stage E1);
  # `upsert_run` swallows the resulting `value out of int32 range`, so the stands do not see it.
  simulator-super-smoke:
    name: Simulator super-smoke (scheduled/manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geov0_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U geo -d geov0_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run task-isolated expensive simulator selector
        shell: pwsh
        run: >-
          ./scripts/verify_local.ps1
          -Python ((Get-Command python).Source)
          -TaskSlug ci-super-smoke
          -BackendSelector tests/integration/test_simulator_super_smoke.py
          -IncludeExpensive
          -BackendOnly

  # On a real backend since 2026-10-07 (032 S4), the same way as `ui-smoke` above. Tests that change
