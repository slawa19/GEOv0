          ADMIN_TOKEN="$token" JWT_SECRET="$jwt" nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18141 > "$RUNNER_TEMP/admin-e2e-backend.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "$ADMIN_E2E_BACKEND_ORIGIN/health" > /dev/null; then echo "Backend readiness: true"; exit 0; fi
            sleep 1
