# GEO Hub — pytest configuration

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers
#
# `b4_counterexample` IS NOT A QUARANTINE, and the difference is the whole point.
#
# Programme 015 phase B accepted its step-4 design on 2026-09-11 with binding conditions, and made
# each of them "обязательной приёмкой шага 4: каждое пишется красным контрпримером ДО кода". The
# modules carrying this marker are that acceptance. They are RED ON PURPOSE, today and every day
# until `app/core/ledger/journal.py` and migration 021 exist: each one names a property the debt
# journal must have, and fails because nothing in the tree has it yet.
#
# They are deselected from the canonical gate only so a permanently red tier does not stop being a
# signal for the other sessions sharing this working tree (`AGENTS.md` §7). Nothing about that
# deselection makes them optional.
#
# THE CONTRACT, and it binds whoever implements step 4: STEP 4 REMOVES THIS MARKER. It does not
# touch the assertions. Making these tests green by editing what they assert destroys the only
# record of what the journal was required to do - the assertions ARE the requirement, and each test
# names in its docstring the mutation that must turn it red again afterwards. The marker may not
# spread: `tests/unit/test_p015_b4_counterexample_marker_is_not_a_hiding_place.py` fails if it
# appears on any module other than the three it belongs to.
#
# Run them deliberately with `-BackendMarker b4_counterexample`.
markers =
    slow: Mark test as slow (deselect with '-m "not slow"')
    postgres: Tests requiring disposable PostgreSQL semantics
    b4_counterexample: Programme 015 phase B step-2 counterexamples - RED ON PURPOSE until step 4 exists; step 4 removes the marker, never the assertions (see the comment above this list)

# Output
addopts =
    --tb=short
    --strict-markers
cache_dir = .local-run/test-runs/direct-pytest/cache

# Keep CI/test output signal-heavy: these warnings are emitted by third-party
# libs on some Windows/Python combinations and are not actionable for this repo.
filterwarnings =
    ignore:There is no current event loop:DeprecationWarning
    ignore:Unclosed <MemoryObjectSendStream.*:ResourceWarning
    ignore:Unclosed <MemoryObjectReceiveStream.*:ResourceWarning

# Coverage (when using pytest-cov)
# Run with: pytest --cov=app --cov-report=html
