# GEO Hub — pytest configuration

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers
#
# `b4_counterexample` WAS HERE AND IS GONE, 2026-09-12, and its removal is the record of a contract
# kept rather than of a marker cleaned up.
#
# It marked the programme 015 phase B step-2 counterexamples: 107 tests written BEFORE the debt
# journal, red on purpose, each naming a property the journal had to have. They were deselected
# from every tier so that a permanently red suite did not stop being a signal for the other
# sessions sharing this working tree (`AGENTS.md` §7), and the contract written here said, in
# capitals, that STEP 4 REMOVES THE MARKER AND NOT THE ASSERTIONS.
#
# Step 4 slice C built `app/core/ledger/journal.py` into the four production writers and armed it.
# The counterexamples rejoined the default and PostgreSQL tiers with their assertions untouched,
# and `tests/unit/test_p015_b4_counterexample_marker_is_not_a_hiding_place.py` now holds the marker
# OUT: registering it again, or applying it to a module, is what that guard fails on. A marker that
# takes tests out of the gate is the shape `AGENTS.md` §5 calls a source of false green, and the
# only honest end for one is that it stops existing.
markers =
    slow: Mark test as slow (deselect with '-m "not slow"')
    postgres: Tests requiring disposable PostgreSQL semantics

# Output
addopts =
    --tb=short
    --strict-markers
cache_dir = .local-run/test-runs/direct-pytest/cache

# Keep CI/test output signal-heavy: these warnings are emitted by third-party
# libs on some Windows/Python combinations and are not actionable for this repo.
filterwarnings =
    ignore:There is no current event loop:DeprecationWarning
    # The debt journal rolls a savepoint back at the DATABASE level when it refuses that savepoint's
    # RELEASE, and detaches it from the connection so the ROOT stays usable - which is what a
    # release refusal means (`app/core/ledger/journal.py::_release_refused_nested`, design v2 §1.2).
    # The caller's own `async with session.begin_nested()` then rolls the same savepoint back on its
    # way out and finds it already gone. The double rollback is the design, not a defect, and there
    # is nothing for a reader to act on; the refusal itself is asserted by `C10` on both tiers.
    ignore:nested transaction already deassociated from connection
    ignore:Unclosed <MemoryObjectSendStream.*:ResourceWarning
    ignore:Unclosed <MemoryObjectReceiveStream.*:ResourceWarning

# Coverage (when using pytest-cov)
# Run with: pytest --cov=app --cov-report=html
