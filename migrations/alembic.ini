# GEO Hub Alembic Configuration

[alembic]
# Migration scripts directory.
script_location = migrations

# Migration filename template.
file_template = %%(rev)s_%%(slug)s

# prepend_sys_path = .
prepend_sys_path = .

# timezone = utc
timezone = UTC

# SQLAlchemy extensions.
# sqlalchemy.url = driver://user:pass@localhost/dbname
# The URL is supplied through DATABASE_URL or migrations/env.py.

[post_write_hooks]
# Optional post-generation formatting.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
