        '400':
          $ref: '#/components/responses/SimulatorActionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SimulatorActionForbidden'
        '404':
          $ref: '#/components/responses/SimulatorActionNotFound'
        '409':
          $ref: '#/components/responses/SimulatorActionConflict'
        '422':
          $ref: '#/components/responses/SimulatorActionUnprocessable'
        '503':
          description: Action unavailable - RUN_PERIMETER_UNAVAILABLE, TRUSTLINE_USED_UNAVAILABLE or SEEDING_FAILED (flat envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/runs/{run_id}/actions/trustline-close:
    post:
      tags: [Simulator]
      summary: Close a trust line inside a run (Interact Mode)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
