  /admin/graph/snapshot:
    get:
      tags: [Admin]
      summary: Graph snapshot (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: Comma-separated extras to include (incidents,audit_log,transactions)
      responses:
        '200':
          description: Graph snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGraphSnapshotResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/graph/ego:
    get:
      tags: [Admin]
      summary: Ego graph snapshot (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: pid
          required: true
          schema:
            type: string
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: status
