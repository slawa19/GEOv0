  /simulator/events/poll:
    get:
      tags: [Simulator]
      summary: Events poll (fallback) - always empty in the MVP
      description: |
        The polling fallback for clients that cannot hold an SSE connection. It has never had a
        replay buffer: the handler returns an empty array and reads neither query parameter
        (`app/api/v1/simulator.py`, `# MVP: no replay buffer.`).

        Until this version the canon promised an array of `SimulatorEvent` - six variants a client
        would write parsing code for and never receive (`F-011-7`). The contract now states what
        exists. When a replay buffer is built, lifting `maxItems: 0` will be a deliberate contract
        change, not the belated delivery of this old promise.
      parameters:
        - in: query
          name: equivalent
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
          description: >-
            Ignored in the MVP - the handler returns an empty array without reading it. Required so
            that the eventual replay buffer keeps the same call shape.
        - in: query
          name: after
          required: false
          schema:
            type: string
          description: >-
            Ignored in the MVP. Reserved for the cursor semantics a replay buffer would need; the
            previous wording, "Return events strictly after this event_id", described behaviour
            that does not exist.
      responses:
        '200':
          description: >-
            Always an empty array: the MVP has no replay buffer, so no event is ever returned.
          content:
            application/json:
              schema:
                # `maxItems: 0` makes the item schema unreachable, which is why it is left empty
                # rather than pointing at SimulatorEvent. That schema stays in this document - it
                # still describes the SSE stream, which is the debt recorded under RT-011-5.
                type: array
                maxItems: 0
                items: {}
              example: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

