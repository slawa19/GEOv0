    # 011/T1102 (2026-08-23): five operations whose bodies the application already described
    # and the canon did not. Transcribed by hand from the response models, in the style of this
    # document - the canon is authority number one, not a build artifact of the code.
    AdminClearingCycleEdge:
      type: object
      required: [equivalent, debtor, creditor, amount]
      properties:
        equivalent:
          type: string
        debtor:
          type: string
        creditor:
          type: string
        amount:
          # Money stays an exact decimal string (AGENTS.md section 8), never a float.
          type: string

    AdminClearingCyclesForEquivalent:
      type: object
      required: [cycles]
      properties:
        cycles:
          # A cycle is an ordered list of edges, so this is an array of arrays.
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/AdminClearingCycleEdge'

    AdminClearingCyclesResponse:
      type: object
      required: [equivalents]
      properties:
        equivalents:
          # Keyed by equivalent code; the key set is data, not contract.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdminClearingCyclesForEquivalent'

    # 011/T1102 (2026-08-23): the two admin graph reads, whose 200 bodies the canon declared as a
    # bare object. Transcribed by hand from AdminGraphSnapshotResponse and its ego subclass
    # (app/schemas/graph.py:12-63) and from the two handlers that fill them. The participant block
    # and the whole viz computation are duplicated line for line between the handlers, so one set
    # of schemas describes both.
    AdminGraphParticipant:
      type: object
      required: [pid, display_name, type, status]
      properties:
        pid:
          type: string
        display_name:
          type: string
        type:
          type: string
          enum: [person, business, hub]
        status:
          # Lower-cased on the way out, so this is the DB vocabulary
          # (app/db/models/participant.py:22), not the filter words the UI sends in.
          type: string
          enum: [active, suspended, left, deleted]
        # The four viz fields are filled only when `equivalent` is supplied AND names an existing
        # equivalent AND the participant set is non-empty; otherwise all four stay null. The keys
        # are always present either way. `?equivalent=NOSUCH` is a 200 with four nulls, because
        # validate_equivalent_code checks the format only.
        net_balance_atoms:
          # Integer atoms via str(int): no decimal point, negative for a net debtor. NOT a money
          # amount - the major-unit value is this divided by 10 ** precision.
          type: string
          nullable: true
        net_sign:
          # `null` is a MEMBER of the enum, not a `nullable` beside it. In OpenAPI 3.0.3
          # `nullable` widens a sibling `type`; it does not widen an `enum`, and the enum is
          # the narrower of the two, so the pair rejected the null this very schema says is
          # the default answer. Measured with OAS30Validator (`F-011-10`, general form):
          #   {type: integer, nullable: true, enum: [-1, 0, 1]}       + null -> REJECTED
          #   {type: integer, nullable: true, enum: [-1, 0, 1, null]} + null -> ACCEPTED,
          #                                                             and 5 still rejected.
          # This is not hypothetical: `_attach_net_viz` returns before computing anything when
          # `equivalent` is absent (app/api/v1/admin.py:1482-1485), and the participants are
          # built with net_sign=None at :1460 / :1846 - so the DEFAULT call to
          # /admin/graph/snapshot and /admin/graph/ego returned a body this node rejected, on
          # every participant. `nullable: true` is kept because it is now true and doing work.
          type: integer
          nullable: true
          enum: [-1, 0, 1, null]
        viz_color_key:
          # Same class, same writers: :1461 / :1847 set it to None, and only the five branches
          # at :1594-1603 (and :1977-1986 for the ego read) ever assign a string.
          type: string
          nullable: true
          enum:
            - null
            - suspended
            - left
            - deleted
            - business
            - person
            - debt-0
            - debt-1
            - debt-2
            - debt-3
            - debt-4
            - debt-5
            - debt-6
            - debt-7
            - debt-8
        viz_size:
          # Node dimensions in pixels. The field is typed dict[str, int] (app/schemas/graph.py:22)
          # and the only writer builds exactly {"w", "h"}: the two real keys are named, and the
          # map stays as open as the type rather than being closed to a shape the annotation does
          # not promise.
          type: object
          nullable: true
          properties:
            w:
              type: integer
            h:
              type: integer
          additionalProperties:
            type: integer

    AdminGraphDebt:
      # Structurally the same four fields as AdminClearingCycleEdge, but a different model on a
      # different read; kept separate so one response cannot silently retype the other.
      type: object
      required: [equivalent, debtor, creditor, amount]
      properties:
        equivalent:
          type: string
        debtor:
          type: string
        creditor:
          type: string
        amount:
          # Money stays an exact decimal string (AGENTS.md section 8), never a float.
          type: string

    AdminGraphTransactionItem:
      # Built as a plain dict by _graph_fetch_transactions and placed in a list[Any] field, so no
      # response model shapes it.
      type: object
      required: [tx_id, type, state, initiator_pid, created_at, updated_at]
      properties:
        tx_id:
          type: string
        type:
          type: string
          enum:
            - TRUST_LINE_CREATE
            - TRUST_LINE_UPDATE
            - TRUST_LINE_CLOSE
            - PAYMENT
            - CLEARING
            - COMPENSATION
            - COMMODITY_REDEMPTION
        state:
          type: string
          enum:
            - NEW
            - ROUTED
            - PREPARE_IN_PROGRESS
            - PREPARED
            - COMMITTED
            - ABORTED
            - PROPOSED
            - WAITING
            - REJECTED
        initiator_pid:
          type: string
        created_at:
          # Deliberately NOT `format: date-time` - see `F-011-9`. These values are copied raw from
          # the column into a list[Any] field, so the UTC-attaching validator never runs, and
          # under SQLite they carry no offset. The same row served by GET /admin/incidents does
          # carry one. Declaring a format the service does not guarantee is the defect this
          # program exists to remove.
          type: string
        updated_at:
          type: string
        equivalent:
          # payload.get("equivalent"); both writers store a string, null when a row has no key.
          type: string
          nullable: true
        error:
          # NULL is the common case on the wire: `tx.error` is copied raw out of the column
          # (app/api/v1/admin.py:255) and only an aborted transaction ever has one. The seed
          # pack ships the null explicitly - most of its rows carry `"error": null`
          # (admin-fixtures/packs/greenfield-village-100-v2/v1/datasets/transactions.json).
          #
          # The null is a BRANCH, not a sibling `nullable: true`. In OpenAPI 3.0.3 `nullable`
          # modifies a sibling `type` and nothing else, so beside a bare `oneOf` it is inert and
          # the schema rejected the null it claimed to allow (`F-011-10`).
          oneOf:
            - $ref: '#/components/schemas/AdminGraphTransactionError'
            - nullable: true
              enum: [null]

    AdminGraphTransactionError:
      # The abort payload the payment engine writes into the transactions.error JSON column.
      # There is no reader-side validation, so nothing is required and the tail stays open.
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AdminGraphSnapshotResponse:
      type: object
      required: [participants, trustlines, equivalents, debts, incidents, audit_log, transactions]
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/AdminGraphParticipant'
        trustlines:
          # Direction is from -> to = creditor -> debtor. One edge per (equivalent, from, to).
          type: array
          items:
            $ref: '#/components/schemas/TrustLine'
        equivalents:
          # Always the full table on both reads - the dropdown reads this list, so the ego read
          # deliberately does not narrow it.
          type: array
          items:
            $ref: '#/components/schemas/StoredEquivalent'
        debts:
          type: array
          items:
            $ref: '#/components/schemas/AdminGraphDebt'
        # The three below are list[Any] on the model, so their item shape comes from the fetch
        # helper. Each is present and empty unless named in the `include` CSV.
        incidents:
          type: array
          items:
            # NOT AdminIncidentItem: same row, same keys, different wire. See F-011-9.
            $ref: '#/components/schemas/AdminGraphIncidentItem'
        audit_log:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLogItem'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AdminGraphTransactionItem'

    AdminGraphEgoResponse:
      # The ego read returns the snapshot body plus the root; the subclass appends its field, so
      # root_pid is the last key on the wire.
      allOf:
        - $ref: '#/components/schemas/AdminGraphSnapshotResponse'
        - type: object
          properties:
            root_pid:
              type: string
              nullable: true

    AdminGraphIncidentItem:
      # 011/`F-011-9`: the very same stuck-payment row as AdminIncidentItem, with the very same
      # keys, but served through the graph reads - and one field differs on the wire.
      # `_graph_fetch_incidents` puts `tx.created_at` into a plain dict (app/api/v1/admin.py:217)
      # which lands in a `list[Any]` field (app/schemas/graph.py:39), so the UTC-attaching
      # validator on AdminIncidentItem never runs. Under SQLite the column comes back naive and
      # the value goes out with no offset, while GET /admin/incidents serves the same row with a
      # trailing Z. Proved by running the production models on one naive datetime: the item model
      # yields `2026-08-23T12:00:00Z`, the graph response `2026-08-23T12:00:00`.
      #
      # Hence no `format: date-time` here. Declaring one would make authority number one promise
      # something the service does not deliver, which is the defect this programme removes. The
      # behavioural fix - making both paths agree - changes the wire and is therefore out of scope
      # for 011 by its own Non-goals; it is recorded as a debt with no owner in this programme.
      type: object
      # 011/T1108: `created_at` used to be absent from `required` and declared nullable, while the
      # sibling AdminGraphTransactionItem - fed from the same column by a helper written the same
      # way - declared it required and non-nullable. At most one of those could be right. The
      # helper always writes the key (app/api/v1/admin.py:217) and the column is NOT NULL with a
      # server default (app/db/models/transaction.py:18), so the sibling was right.
      required: [tx_id, state, initiator_pid, equivalent, age_seconds, sla_seconds, created_at]
      properties:
        tx_id:
          type: string
        state:
          # The query filters to `_ACTIVE_PAYMENT_TX_STATES` (app/api/v1/admin.py:113-120), so this
          # is six of the nine transaction states, not all nine. The first version of this schema
          # left it a bare string - the most constrained field on the read carrying the least
          # description, in a programme about describing what is returned.
          type: string
          enum: [NEW, ROUTED, PREPARE_IN_PROGRESS, PREPARED, PROPOSED, WAITING]
        initiator_pid:
          type: string
        equivalent:
          type: string
        age_seconds:
          type: integer
          minimum: 0
        sla_seconds:
          type: integer
          minimum: 0
        created_at:
          # Deliberately without `format: date-time` - the offset is missing here. Same reasoning
          # as AdminGraphTransactionItem.created_at, reached by a different route.
          type: string

    AdminIncidentItem:
      # Served by GET /admin/incidents, where the response model does run and its validator
      # attaches UTC. The graph reads use AdminGraphIncidentItem instead - see F-011-9.
      type: object
      required: [tx_id, state, initiator_pid, equivalent, age_seconds, sla_seconds]
      properties:
        tx_id:
          type: string
        state:
          type: string
        initiator_pid:
          type: string
        equivalent:
          type: string
        age_seconds:
          type: integer
          minimum: 0
        sla_seconds:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          nullable: true

    AdminIncidentsListResponse:
      type: object
      required: [page, per_page, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
