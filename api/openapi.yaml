        This endpoint is modeled as `text/event-stream` in OpenAPI.
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/EquivalentQuery'
        - in: header
          name: Last-Event-ID
          required: false
          description: |
            Resume after this previously observed SSE event ID. If the cursor is
            malformed, belongs to another run, is ahead of the run, has been pruned,
            or cannot fit in the subscriber bootstrap queue, the server returns `410`.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Replay cursor is invalid or cannot be delivered completely
          content:
