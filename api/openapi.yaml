components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PidPath:
      in: path
      name: pid
      required: true
      schema:
        type: string
    TrustLineIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
        description: TrustLine UUID

    ScenarioIdPath:
      in: path
      name: scenario_id
      required: true
      schema:
        type: string

    RunIdPath:
      in: path
      name: run_id
      required: true
      schema:
        type: string

    ArtifactNamePath:
      in: path
      name: name
      required: true
      schema:
        type: string

    EquivalentQuery:
      in: query
      name: equivalent
      required: true
      schema:
        $ref: '#/components/schemas/EquivalentCode'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    # Two shapes, and the reason is the order in which the two layers answer: the security
    # scheme runs inside FastAPI's dependency solver, before any application code and therefore
    # before the exception handlers that produce ErrorEnvelope. On the operations whose bearer
    # credential is mandatory - OAuth2PasswordBearer(auto_error=True), app/api/deps.py - a request
    # with no Authorization header, or one whose scheme is not Bearer, is refused by the scheme
    # itself with FastAPI's own flat {"detail": "Not authenticated"}. Only once a Bearer token is
    # actually present does get_current_participant run and raise UnauthorizedException, which the
    # global handler wraps in ErrorEnvelope (E006). Both halves are measured; declaring only the
    # envelope made authority number one reject the commonest 401 the service sends.
    # The plain `Unauthorized` above stays correct for the operations whose scheme is
    # auto_error=False (the simulator and integrity surfaces): there the scheme returns None and
    # every 401 comes from application code.
    UnauthorizedBearer:
      description: >-
        No usable bearer credential. Two shapes are reachable: a missing Authorization header,
        or one carrying a scheme other than Bearer, is refused by the security scheme itself
        with the flat {"detail": "Not authenticated"}; a Bearer token that is present but
        rejected reaches get_current_participant and is answered with ErrorEnvelope (E006).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                required: [detail]
                properties:
                  detail:
                    type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: >-
        The credentials were recognised and are not permitted here: a missing or wrong
        X-Admin-Token, a cookie-auth simulator request whose Origin is not in the CSRF
        allowlist, or a participant whose account is not active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: >-
        Request validation failed: a missing, malformed or out-of-range parameter or body.
        On the simulator surface this status also answers an X-Simulator-Owner override that
        is empty or does not match ^[A-Za-z0-9._:-]{1,64}$, which require_simulator_actor
        rejects before the handler runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SimulatorIdentityUnprocessable:
      description: >-
        The simulator identity transport was rejected before the handler ran: an
        X-Simulator-Owner override that is empty or does not match ^[A-Za-z0-9._:-]{1,64}$.
        This operation has no falsifiable request parameter of its own, so this is the only
        422 it answers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: >-
        Measured data is unavailable and the endpoint refuses to substitute
        synthetic data (real-mode simulator analytics).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    SimulatorActionBadRequest:
      description: Invalid request payload for the action (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionForbidden:
      description: >-
        Actions disabled or access denied (flat SimulatorActionError), or the identity was
        rejected before the handler ran (ErrorEnvelope). Both shapes are reachable: the guard
        inside the handler answers flat, while require_simulator_actor raises before it and the
        global handler wraps the result.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SimulatorActionError'
              - $ref: '#/components/schemas/ErrorEnvelope'
    SimulatorActionNotFound:
      description: Run, participant, equivalent or trustline not found (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionConflict:
      description: Run is terminal, or the action conflicts with current state (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionUnprocessable:
      description: Invalid simulator identity transport (for example, X-Simulator-Owner)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # Interact Mode control plane payloads (011/T1101, added 2026-08-23).
    # Money-carrying fields (limit, used, available, amount, cleared amounts) are exact
    # decimal strings, per AGENTS.md section 8 - never floats.
    SimulatorActionTrustlineCreateRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent, limit]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineCreateResponse:
      type: object
      additionalProperties: false
      required: [trustline_id, from_pid, to_pid, equivalent, limit]
      properties:
        ok:
          type: boolean
          default: true
        trustline_id:
          type: string
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineUpdateRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent, new_limit]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        new_limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineUpdateResponse:
      type: object
      additionalProperties: false
