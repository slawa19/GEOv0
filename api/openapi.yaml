openapi: 3.0.3
info:
  title: GEO Hub API
  version: 0.1
  description: |
    OpenAPI spec for GEO Hub (MVP v0.1). Derived from docs/ru/04-api-reference.md.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Participants
  - name: TrustLines
  - name: Payments
  - name: Balance
  - name: Clearing
  - name: Equivalents
  - name: Health
  - name: Admin
  - name: Simulator
security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime_seconds, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string
                  environment:
                    type: string
                    nullable: true
                  uptime_seconds:
                    type: integer
                    minimum: 0
                  timestamp:
                    type: string
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime_seconds, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string
                  environment:
                    type: string
                    nullable: true
                  uptime_seconds:
                    type: integer
                    minimum: 0
                  timestamp:
                    type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /healthz:
    get:
      tags: [Health]
      summary: Health check (alias)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health/db:
    get:
      tags: [Health]
      summary: Database health check
      security: []
      responses:
        '200':
          description: DB OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '503':
          description: DB unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [error]
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/health/db:
    get:
      tags: [Health, Admin]
      summary: Authenticated database diagnostic
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DB OK
          content:
            application/json:
              schema: {}
        '403':
          description: Admin token required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        nullable: true
        '503':
          description: Database unavailable
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        nullable: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/config:
    get:
      tags: [Admin]
      summary: Get runtime config (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Config items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Admin]
      summary: Patch runtime config subset (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConfigPatchRequest'
      responses:
        '200':
          description: Updated keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigPatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/whoami:
    get:
      tags: [Admin]
      summary: Who am I (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWhoAmIResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/feature-flags:
    get:
      tags: [Admin]
      summary: Get feature flags (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeatureFlags'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Admin]
      summary: Patch feature flags (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFeatureFlagsPatchRequest'
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeatureFlags'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants:
    get:
      tags: [Admin]
      summary: List participants (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [person, business, hub]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Participants list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantsListResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants/stats:
    get:
      tags: [Admin]
      summary: Participants stats (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Participants stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantsStatsResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants/{pid}/freeze:
    post:
      tags: [Admin]
      summary: Freeze participant (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminParticipantActionRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants/{pid}/unfreeze:
    post:
      tags: [Admin]
      summary: Unfreeze participant (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminParticipantActionRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants/{pid}/ban:
    post:
      tags: [Admin]
      summary: Ban participant (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminParticipantActionRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantStatusChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/participants/{pid}/unban:
    post:
      tags: [Admin]
      summary: Unban participant (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminParticipantActionRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminParticipantStatusChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/audit-log:
    get:
      tags: [Admin]
      summary: List audit log (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: object_type
          schema:
            type: string
        - in: query
          name: object_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit log items
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/equivalents:
    get:
      tags: [Admin]
      summary: List equivalents (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: include_inactive
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Equivalents list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquivalentsList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Admin]
      summary: Create equivalent (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEquivalentCreateRequest'
      responses:
        '200':
          description: Equivalent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equivalent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/equivalents/{code}:
    patch:
      tags: [Admin]
      summary: Patch equivalent (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: path
          name: code
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEquivalentUpdateRequest'
      responses:
        '200':
          description: Equivalent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equivalent'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      tags: [Admin]
      summary: Delete equivalent (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: path
          name: code
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeleteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/equivalents/{code}/usage:
    get:
      tags: [Admin]
      summary: Equivalent usage (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: path
          name: code
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEquivalentUsageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/migrations:
    get:
      tags: [Admin]
      summary: Migrations status (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Migration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMigrationsStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/trustlines:
    get:
      tags: [Admin]
      summary: List trustlines (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
          description: Equivalent code filter
        - in: query
          name: creditor
          required: false
          schema:
            type: string
          description: Creditor PID (trustline 'from')
        - in: query
          name: debtor
          required: false
          schema:
            type: string
          description: Debtor PID (trustline 'to')
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, frozen, closed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Trustlines list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/trustlines/bottlenecks:
    get:
      tags: [Admin]
      summary: Trustlines bottlenecks (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: threshold
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.10
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Bottlenecks list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/liquidity/summary:
    get:
      tags: [Admin]
      summary: Liquidity summary (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: threshold
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.10
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Liquidity summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/incidents:
    get:
      tags: [Admin]
      summary: List incidents (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Incidents list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIncidentsListResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/transactions/{tx_id}/abort:
    post:
      tags: [Admin]
      summary: Abort transaction (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: path
          name: tx_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Aborted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAbortTxResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/graph/snapshot:
    get:
      tags: [Admin]
      summary: Graph snapshot (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: Comma-separated extras to include (incidents,audit_log,transactions)
      responses:
        '200':
          description: Graph snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/graph/ego:
    get:
      tags: [Admin]
      summary: Ego graph snapshot (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: query
          name: pid
          required: true
          schema:
            type: string
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: Comma-separated extras to include (incidents,audit_log,transactions)
      responses:
        '200':
          description: Ego snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/graph/snapshot:
    get:
      tags: [Simulator]
      summary: Graph snapshot (simulator)
      parameters:
        - in: query
          name: equivalent
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
      responses:
        '200':
          description: Graph snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorGraphSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/graph/ego:
    get:
      tags: [Simulator]
      summary: Ego graph snapshot (simulator)
      parameters:
        - in: query
          name: equivalent
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
        - in: query
          name: pid
          required: true
          schema:
            type: string
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Ego snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorGraphSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/events:
    get:
      tags: [Simulator]
      summary: Events stream (SSE)
      description: |
        Server-Sent Events stream. Each message contains one JSON event.

        This endpoint is modeled as `text/event-stream` in OpenAPI.
      parameters:
        - in: query
          name: equivalent
          required: true
          schema:
            $ref: '#/components/schemas/EquivalentCode'
        - in: header
          name: Last-Event-ID
          required: false
          description: |
            Resume after this previously observed SSE event ID. The server returns
            `410` when the cursor is malformed, belongs to another run, is ahead of
            the run, has been pruned, or cannot fit in the subscriber bootstrap queue.
          schema:
            type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Replay cursor is invalid or cannot be delivered completely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
