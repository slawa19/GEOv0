    # 011/T1110 (2026-08-24): the three JSON documents `GET /simulator/runs/{run_id}/artifacts/
    # {name}` really serves. Until now that operation declared one `application/octet-stream`
    # body, and the conformance harness therefore skipped every JSON artifact as "a binary
    # download" - including a body of broken JSON, measured. Each schema below was read off the
    # writer named in its comment, and `additionalProperties: false` on all three is what makes
    # the `oneOf` at the operation unambiguous.

    SimulatorArtifactStatusInit:
      # `status.json` as `init_run_artifacts` first writes it (app/core/simulator/artifacts.py:67):
      # six literals off the RunRecord, written when the run is created. This is only the FIRST of
      # the file's two shapes - `finalize_run_artifacts` overwrites it with a `RunStatus` on stop
      # (artifacts.py:343), which is why the operation lists both.
      type: object
      required: [api_version, run_id, scenario_id, mode, created_at, seed]
      properties:
        api_version:
          type: string
          example: simulator-api/1
        run_id:
          type: string
        scenario_id:
          type: string
        mode:
          # RunMode = Literal["fixtures", "real"] (app/schemas/simulator.py:376). A plain string
          # on the wire, because the artifact is written with `json.dumps`, not by pydantic.
          type: string
          enum: [fixtures, real]
        created_at:
          type: string
          format: date-time
        seed:
          # RunRecord.seed is `int = 0` (app/core/simulator/models.py:143); never null.
          type: integer
      additionalProperties: false

    SimulatorArtifactSummary:
      # `summary.json` (app/core/simulator/artifacts.py:313-344, written on stop). Six literals
      # plus the run status, and `status` is not a copy of anything - it is the same
      # `status_payload` argument that becomes `status.json`, so it is a `RunStatus`.
      type: object
      required: [api_version, generated_at, run_id, scenario_id, mode, state, status]
      properties:
        api_version:
          type: string
          example: simulator-api/1
        generated_at:
          type: string
          format: date-time
        run_id:
          type: string
        scenario_id:
          type: string
        mode:
          type: string
          enum: [fixtures, real]
        state:
          $ref: '#/components/schemas/RunState'
        status:
          $ref: '#/components/schemas/RunStatus'
      additionalProperties: false

    SimulatorArtifactLastTick:
      # `last_tick.json`. Two writers, one schema: `init_run_artifacts` writes the two required
      # keys at run creation (app/core/simulator/artifacts.py:64) and the real-mode tick loop
      # writes all seven, throttled (real_tick_persistence.py:178 -> artifacts.py:361). The five
      # counters are optional because the init record genuinely lacks them, not because they are
      # ever null - every one is written through `int(...)`.
      type: object
      required: [tick_index, sim_time_ms]
      properties:
        tick_index:
          type: integer
          minimum: 0
        sim_time_ms:
          type: integer
          minimum: 0
        budget:
          type: integer
          minimum: 0
        committed:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        timeouts:
          type: integer
          minimum: 0
      additionalProperties: false

    SetIntensityRequest:
      type: object
      required: [intensity_percent]
      properties:
        intensity_percent:
          type: integer
          minimum: 0
          maximum: 100
      additionalProperties: false

    MetricPoint:
      type: object
      required: [t_ms, v]
      properties:
        t_ms:
          type: integer
          minimum: 0
        v:
          # 2026-08-20 / p007_t715: decimal string, not a number. Two of the
          # seven series (total_debt, clearing_volume) are amounts in the
          # selected equivalent, and money stays exact decimal. One type for all
          # seven series: the values come from one column, so a union would only
          # force consumers to branch.
          # The form is fixed and identical for the DB-backed and the synthetic
          # producer: the eight fractional digits of the Numeric(20, 8) column,
          # plain decimal notation, never exponential.
          # null means "no measurement at/before this timestamp"; it is
          # intentionally distinguishable from a measured zero ("0.00000000").
          type: string
          nullable: true
          description: Metric value as decimal string
      additionalProperties: false

    MetricSeriesKey:
      type: string
      enum:
        - success_rate
        - avg_route_length
        - total_debt
        - clearing_volume
        - bottlenecks_score
        # Network cardinalities. Measured per tick and persisted since the
        # simulator storage MVP; exposed here by spec 007 / T713 so the canon,
        # the pydantic model, the reader and the writer describe one set.
        - active_participants
        - active_trustlines

    MetricSeries:
      type: object
      required: [key, points]
      properties:
        key:
          $ref: '#/components/schemas/MetricSeriesKey'
        unit:
          # `nullable: true` deleted, not widened. The model types it Optional
          # (`MetricUnit = Optional[Literal[...]]`, app/schemas/simulator.py:510-515), but both
          # constructors pass a unit from a literal (key, unit) table - the real-mode path at
          # app/core/simulator/metrics_bottlenecks.py:237 and the synthetic one at :322, over
          # the seven pairs listed at :169-182 - and `extra="forbid"` keeps anything else from
          # building one. Null never reaches the wire, so the enum was already the truth and
          # the `nullable` beside it was a promise the enum refused to keep.
          type: string
          enum: ['%', count, amount]
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
      additionalProperties: false

    MetricsResponse:
      type: object
      required: [api_version, run_id, equivalent, from_ms, to_ms, step_ms, series]
      properties:
        api_version:
          type: string
          example: simulator-api/1
        run_id:
          type: string
        equivalent:
          type: string
        from_ms:
          type: integer
          minimum: 0
        to_ms:
          type: integer
          minimum: 0
        step_ms:
          type: integer
          minimum: 1
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
      additionalProperties: false

    BottleneckTarget:
      oneOf:
        - type: object
          required: [kind, from, to]
          properties:
            kind:
              type: string
              enum: [edge]
            from:
              type: string
            to:
              type: string
          additionalProperties: false
        - type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [node]
            id:
              type: string
          additionalProperties: false

    BottleneckReasonCode:
      type: string
      enum:
        - LOW_AVAILABLE
        - HIGH_USED
        - FREQUENT_ABORTS
        - TOO_MANY_TIMEOUTS
        - ROUTING_TOO_DEEP
        - CLEARING_PRESSURE

    BottleneckItem:
      type: object
      required: [target, score, reason_code]
      properties:
        target:
          $ref: '#/components/schemas/BottleneckTarget'
        score:
          type: number
        reason_code:
          $ref: '#/components/schemas/BottleneckReasonCode'
        label:
          type: string
          nullable: true
        suggested_action:
          type: string
          nullable: true
      additionalProperties: false

    BottlenecksResponse:
      type: object
      required: [api_version, run_id, equivalent, items]
      properties:
        api_version:
          type: string
          example: simulator-api/1
        run_id:
          type: string
        equivalent:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BottleneckItem'
      additionalProperties: false

    ArtifactItem:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        content_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
          minimum: 0
        sha256:
          type: string
          nullable: true
        url:
          type: string
      additionalProperties: false

    ArtifactIndex:
      type: object
      required: [api_version, run_id, items]
      properties:
        api_version:
          type: string
          example: simulator-api/1
        run_id:
          type: string
        artifact_path:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactItem'
        bundle_url:
          type: string
          nullable: true
      additionalProperties: false

    # 011/T1102 (2026-08-23): the five remaining admin reads, whose 200 bodies the canon declared
    # as a bare object. Every key below was read off the response models (app/schemas/admin.py,
    # app/schemas/metrics.py, app/schemas/trustline.py) AND observed on the wire by calling the
    # five routes against a seeded SQLite database.
    #
    # A note that applies to all of them: none of these routes sets response_model_exclude_none or
    # response_model_exclude_unset, so FastAPI emits EVERY declared field on every response. A
    # field that is "optional" in Python is present-and-null on the wire, which is why the
    # `required:` lists below are exhaustive and the optionality shows up as `nullable: true`.

    AdminTrustLinesListResponse:
      # GET /admin/trustlines (app/api/v1/admin.py:1396). AdminPaginatedMeta + items, the same
      # four-key shape as AdminParticipantsListResponse and AdminIncidentsListResponse.
      type: object
      required: [page, per_page, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          # The unpaginated count from TrustLineService.count_all with the same filters.
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrustLine'

    AdminAuditLogListResponse:
      # GET /admin/audit-log (app/api/v1/admin.py:960). Distinct from the existing
      # AdminAuditLogResponse, which carries `items` alone and is not referenced by any operation.
      type: object
      required: [page, per_page, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        items:
          # Rows are ORM AuditLog objects validated straight into AdminAuditLogItem, newest
          # timestamp first. before_state/after_state stay open - see ACCEPTED_FREE_FORM.
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLogItem'

    AdminTrustLinesBottlenecksResponse:
      # GET /admin/trustlines/bottlenecks (app/api/v1/admin.py:693).
      type: object
      required: [threshold, items]
      properties:
        threshold:
          # A NUMBER here, not a decimal string: the handler parses the query into a Decimal and
          # then calls float() on it before building the response
          # (app/api/v1/admin.py:709, AdminTrustLinesBottlenecksResponse.threshold: float).
          # It is a ratio, not money, so AGENTS.md section 8 does not apply. Contrast
          # AdminParticipantMetricsResponse.meta.threshold, which is the same query parameter
          # served as a decimal string.
          type: number
          minimum: 0
          maximum: 1
        items:
          # Active trustlines with limit > 0 whose available/limit ratio is strictly below
          # `threshold`, ordered by available ascending then created_at ascending, capped at the
          # `limit` query parameter. `used` is the matching Debt row (0 when there is none) and
          # `available` is limit - used, both computed in the query, not stored.
          type: array
          items:
            $ref: '#/components/schemas/TrustLine'

    AdminLiquidityNetRow:
      # One ranked participant in the three top-N lists of the liquidity summary.
      type: object
      required: [pid, display_name, net]
      properties:
        pid:
          type: string
        display_name:
          type: string
        net:
          # Money: total credited minus total debited across the selected equivalent(s), as an
          # exact decimal string (AGENTS.md section 8). Negative for a net debtor. NOT atoms -
          # this is the raw Debt.amount sum in major units.
          type: string

    AdminLiquiditySummaryResponse:
      # GET /admin/liquidity/summary (app/api/v1/admin.py:712).
      type: object
      required:
        - equivalent
        - threshold
        - updated_at
        - active_trustlines
        - bottlenecks
        - incidents_over_sla
        - total_limit
        - total_used
        - total_available
        - top_creditors
        - top_debtors
        - top_by_abs_net
        - top_bottleneck_edges
      properties:
        equivalent:
          # The `equivalent` query parameter, trimmed and upper-cased, or null when it was omitted
          # or blank (app/api/v1/admin.py:719-720). Echoed with no lookup: an unknown code is a 200
          # with this field set and every aggregate at zero, not a 404. Deliberately NOT
          # $ref EquivalentCode - nothing validates the pattern on this route.
          type: string
          nullable: true
        threshold:
          # A NUMBER, via float(Decimal(...)) - see the note on
          # AdminTrustLinesBottlenecksResponse.threshold.
          type: number
          minimum: 0
          maximum: 1
        updated_at:
          # datetime.now(timezone.utc) at handler entry, so it is always offset-aware and the
          # format is honest here (unlike the raw column copies in AdminGraphTransactionItem).
          type: string
          format: date-time
        active_trustlines:
          # COUNT over trustlines with status = 'active', filtered by equivalent when given.
          type: integer
          minimum: 0
        bottlenecks:
          # The TOTAL number of edges below the threshold, not the length of
          # top_bottleneck_edges: the helper counts every match and only then applies `limit`
          # (app/api/v1/admin.py:667-668).
          type: integer
          minimum: 0
        incidents_over_sla:
          # PAYMENT transactions still in a non-terminal state whose updated_at is older than
          # PAYMENT_TX_STUCK_TIMEOUT_SECONDS. When `equivalent` is given the filter is applied in
          # Python against payload["equivalent"], so a row with no equivalent in its payload is
          # excluded from a filtered count but included in the unfiltered one.
          type: integer
          minimum: 0
        total_limit:
          # Money, exact decimal string: SUM of TrustLine.limit over active lines.
          type: string
        total_used:
          # Money: SUM of coalesce(Debt.amount, 0) over the same lines.
          type: string
        total_available:
          # Money: SUM of (limit - used). Equals total_limit - total_used.
          type: string
        top_creditors:
          # Net > 0, descending, capped at the `limit` query parameter.
          type: array
          items:
            $ref: '#/components/schemas/AdminLiquidityNetRow'
        top_debtors:
          # Net < 0, ascending (most negative first), same cap.
          type: array
          items:
            $ref: '#/components/schemas/AdminLiquidityNetRow'
        top_by_abs_net:
          # Ranked by abs(net) with no sign filter, so its rows overlap the two lists above.
          type: array
          items:
            $ref: '#/components/schemas/AdminLiquidityNetRow'
        top_bottleneck_edges:
          # The same rows GET /admin/trustlines/bottlenecks returns for this threshold, limit and
          # equivalent - one shared helper builds both (_load_admin_trustline_bottlenecks).
          type: array
          items:
            $ref: '#/components/schemas/TrustLine'

    AdminParticipantBalanceRow:
      # One equivalent's aggregates for the participant. All six amounts are money as exact
      # decimal strings. Rows count LIVE trustlines only (status != 'closed'): since migration 019
      # a closed incarnation can coexist with the live one and summing both double-counts
      # (app/core/admin/metrics.py:196-199).
      type: object
      required:
        - equivalent
        - outgoing_limit
        - outgoing_used
        - incoming_limit
        - incoming_used
        - total_debt
        - total_credit
        - net
      properties:
        equivalent:
          type: string
        outgoing_limit:
          # Participant is the creditor (trustline `from`).
          type: string
        outgoing_used:
          type: string
        incoming_limit:
          # Participant is the debtor (trustline `to`).
          type: string
        incoming_used:
          type: string
        total_debt:
          # SUM of Debt.amount where the participant is the debtor. Unlike the four limit/used
          # figures this is not restricted to live trustlines - it reads the debts table.
          type: string
        total_credit:
          type: string
        net:
          # total_credit - total_debt; negative for a net debtor.
          type: string

    AdminParticipantCounterpartySplitRow:
      type: object
      required: [pid, display_name, amount, share]
      properties:
        pid:
          type: string
        display_name:
          # Never null: falls back to the pid when the column is blank
          # (app/core/admin/metrics.py:324).
          type: string
        amount:
          # Money, exact decimal string.
          type: string
        share:
          # amount / total as a float, or 0.0 when the total is zero. A ratio, not money - the one
          # place in this family where float(Decimal / Decimal) is applied to money-derived values.
          type: number

    AdminParticipantCounterpartySplit:
      # Who the participant owes and who owes them, for the requested equivalent only.
      type: object
      required: [eq, totalDebt, totalCredit, creditors, debtors]
      properties:
        eq:
          type: string
        totalDebt:
          # camelCase on the wire: the field is total_debt in Python with
          # serialization_alias="totalDebt" (app/schemas/metrics.py:31-32), and FastAPI serializes
          # responses with by_alias=True. Money, exact decimal string.
          type: string
        totalCredit:
          # Same aliasing as totalDebt.
          type: string
        creditors:
          # Counterparties the participant owes (participant is the debtor), sorted by amount
          # descending then pid. `share` is of totalDebt.
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantCounterpartySplitRow'
        debtors:
          # Counterparties who owe the participant; `share` is of totalCredit.
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantCounterpartySplitRow'

    AdminParticipantConcentrationSide:
      type: object
      required: [top1, top5, hhi]
      properties:
        top1:
          # Largest single counterparty share, 0.0 when there are none.
          type: number
        top5:
          # Sum of the five largest shares.
          type: number
        hhi:
          # Herfindahl-Hirschman index as the sum of squared shares, so it is on the 0..1 scale,
          # not the 0..10000 scale the name usually implies (app/core/admin/metrics.py:74-75).
          type: number

    AdminParticipantConcentration:
      # Computed purely from the counterparty split - no extra query.
      type: object
      required: [eq, outgoing, incoming]
      properties:
        eq:
          type: string
        outgoing:
          # Shares of the `creditors` list, i.e. concentration of what the participant owes.
          $ref: '#/components/schemas/AdminParticipantConcentrationSide'
        incoming:
          # Shares of the `debtors` list.
          $ref: '#/components/schemas/AdminParticipantConcentrationSide'

    AdminParticipantNetDistributionBin:
      type: object
      required: [from_atoms, to_atoms, count]
      properties:
        from_atoms:
          # Integer atoms via str(int): no decimal point, negative allowed. NOT a money amount -
          # the major-unit value is this divided by 10 ** equivalent precision. Bin bounds are
          # half-open [from_atoms, to_atoms) except the last bin, whose to_atoms is the maximum.
          type: string
        to_atoms:
          type: string
        count:
          type: integer
          minimum: 0

    AdminParticipantNetDistribution:
      # Net position of EVERY participant in the system for this equivalent, bucketed - the
      # requested participant is one point in it, not the subject.
      type: object
      required: [eq, min_atoms, max_atoms, bins]
      properties:
        eq:
          type: string
        min_atoms:
          # Same atoms-as-string convention as the bin bounds.
          type: string
        max_atoms:
          type: string
        bins:
          # Exactly 20 bins of equal integer width, or a single degenerate bin holding every
          # participant when max == min (app/core/admin/metrics.py:405-411).
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantNetDistributionBin'

    AdminParticipantRank:
      type: object
      required: [eq, rank, n, percentile, net]
      properties:
        eq:
          type: string
        rank:
          # 1-based, 1 = largest net. The code keeps a 0 branch for a pid missing from the
          # participants table, which the handler's own earlier lookup makes unreachable.
          type: integer
          minimum: 0
        n:
          # Total participants ranked, i.e. every row of the participants table.
          type: integer
          minimum: 0
        percentile:
          # (n - rank) / (n - 1), and exactly 1.0 when n <= 1.
          type: number
        net:
          # Money, exact decimal string - but it has been through atoms and back
          # (_decimal_to_atoms truncates toward zero at the equivalent's precision, then
          # _atoms_to_decimal quantizes), so it can differ from AdminParticipantBalanceRow.net in
          # the sub-precision digits and it carries exactly `precision` decimal places.
          type: string

    AdminParticipantCapacitySide:
      type: object
      required: [limit, used, pct]
      properties:
        limit:
          # Money, exact decimal string; live trustlines only (status != 'closed').
          type: string
        used:
          type: string
        pct:
          # used / limit as a float, 0.0 when limit is 0. A ratio, not money.
          type: number

    AdminParticipantCapacityBottleneck:
      type: object
      required: [dir, other, trustline]
      properties:
        dir:
          # Direction relative to the requested participant: "out" = they are the creditor.
          type: string
          enum: [out, in]
        other:
          # The counterparty PID, or the raw participant UUID as a string if the pid lookup misses
          # (app/core/admin/metrics.py:503-504).
          type: string
        trustline:
          # from_display_name and to_display_name are hard-coded to null on this path
          # (app/core/admin/metrics.py:511-512) - unlike the same schema served by
          # /admin/trustlines/bottlenecks, which joins the names.
          $ref: '#/components/schemas/TrustLine'

    AdminParticipantCapacity:
      type: object
      required: [eq, out, inc, bottlenecks]
      properties:
        eq:
          type: string
        out:
          # Lines where the participant is the creditor.
          $ref: '#/components/schemas/AdminParticipantCapacitySide'
        inc:
          # Lines where the participant is the debtor. Note the key is `inc`, not `in`.
          $ref: '#/components/schemas/AdminParticipantCapacitySide'
        bottlenecks:
          # ALWAYS EMPTY unless the `threshold` query parameter is supplied: the guard is
          # `thr is not None`, and threshold has no default on this route
          # (app/api/v1/admin.py:2227, app/core/admin/metrics.py:527). Sorted by dir, then
          # counterparty pid, then trustline id. A line the participant sits on both ends of
          # would appear twice, once per direction.
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantCapacityBottleneck'

    AdminParticipantActivity:
      # Event counts in trailing windows. "Now" is not the clock: it is the maximum timestamp
      # found among the participant's trustlines, their audit rows and ALL transactions, falling
      # back to utcnow only when none exists (app/core/admin/metrics.py:608).
      type: object
      required:
        - windows
        - trustline_created
        - trustline_closed
        - incident_count
        - participant_ops
        - payment_committed
        - clearing_committed
        - has_transactions
      properties:
        windows:
          # Always literally [7, 30, 90]; no parameter changes it.
          type: array
          items:
            type: integer
        trustline_created:
          # Keys are the window sizes as decimal strings - "7", "30", "90" - because the Python
          # type is dict[int, int] and JSON object keys are strings. Windows are cumulative and
          # nested, so the 90 count includes the 30 count.
          type: object
          additionalProperties:
            type: integer
        trustline_closed:
          type: object
          additionalProperties:
            type: integer
        incident_count:
          # Stuck PAYMENT transactions the participant initiated. Not filtered by equivalent.
          type: object
          additionalProperties:
            type: integer
        participant_ops:
          # Audit rows against this pid whose action starts with PARTICIPANT_ or
          # admin.participants. - two vocabularies, both matched.
          type: object
          additionalProperties:
            type: integer
        payment_committed:
          type: object
          additionalProperties:
            type: integer
        clearing_committed:
          type: object
          additionalProperties:
            type: integer
        has_transactions:
          # True when the pre-filter query returned any committed PAYMENT/CLEARING row in the
          # widest window AT ALL - it is not about this participant, so it can be true while every
          # count above is zero (app/core/admin/metrics.py:683).
          type: boolean

    AdminParticipantMetricsResponse:
      # GET /admin/participants/{pid}/metrics (app/api/v1/admin.py:2223), assembled by
      # compute_participant_metrics. Six of the nine keys are filled only when `equivalent` is
      # supplied; without it the handler returns early and they are present-and-null
      # (app/core/admin/metrics.py:120).
      type: object
      required:
        - pid
        - equivalent
        - balance_rows
        - counterparty
        - concentration
        - distribution
        - rank
        - capacity
        - activity
        - meta
      properties:
        pid:
          # The path parameter, trimmed. A blank or unknown pid is a 404, so this is never empty.
          type: string
        equivalent:
          # Trimmed and upper-cased, null when omitted. Unlike the liquidity summary this route
          # DOES validate it: validate_equivalent_code enforces the format and an unknown code is
          # a 404, so a non-null value here always names a real equivalent.
          type: string
          nullable: true
        balance_rows:
          # One row per equivalent, ordered by code, when `equivalent` is omitted; exactly one row
          # when it is given. Equivalents the participant has no exposure to still get a row of
          # zeros.
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantBalanceRow'
        counterparty:
          # All six of these are `required` AND present-and-null whenever `equivalent` was
          # omitted: compute_participant_metrics returns at app/core/admin/metrics.py:120 before
          # any of them is computed, and each is `Optional[...] = None` on the response model
          # (app/schemas/metrics.py:107-112) with no `exclude_none` anywhere on the route.
          #
          # `allOf` with a sibling `nullable: true` did NOT say that. In OpenAPI 3.0.3 `nullable`
          # modifies a sibling `type` and nothing else, so beside a bare `allOf` it was inert and
          # all six rejected the null they claimed to allow: a real 200 body from
          # GET /admin/participants/{pid}/metrics failed validation against this document on all
          # six properties, twice each - "None for not nullable" and "None is not of type
          # 'object'" (`F-011-10`). The composition keyword therefore changes from `allOf` to
          # `oneOf`: a null branch cannot be added to an `allOf`, where every branch must match.
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantCounterpartySplit'
            - nullable: true
              enum: [null]
        concentration:
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantConcentration'
            - nullable: true
              enum: [null]
        distribution:
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantNetDistribution'
            - nullable: true
              enum: [null]
        rank:
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantRank'
            - nullable: true
              enum: [null]
        capacity:
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantCapacity'
            - nullable: true
              enum: [null]
        activity:
          oneOf:
            - $ref: '#/components/schemas/AdminParticipantActivity'
            - nullable: true
              enum: [null]
        meta:
          # Declared dict[str, Any] "for forward compatibility", but there is exactly one writer
          # and it stores exactly one key (app/core/admin/metrics.py:163-165). The object is empty
          # when `equivalent` was omitted, because that path returns before meta is built.
          # additionalProperties stays true to match the annotation.
          type: object
          additionalProperties: true
          properties:
            threshold:
              # A decimal STRING here - the raw Decimal from the query parameter, serialized by
              # pydantic's Any-field inference. The SAME query parameter is a `number` on
              # /admin/liquidity/summary and /admin/trustlines/bottlenecks, which call float() on
              # it. Null when the caller supplied `equivalent` but not `threshold`; the key is
              # absent entirely when `equivalent` was omitted, so it is not required.
              type: string
              nullable: true

    IntegrityAuditLogClearingEdge:
      # One entry per edge of the cleared cycle (app/core/clearing/service.py:1649-1656).
      type: object
      required: [debt_id, debtor, creditor, amount]
      additionalProperties: false
      properties:
        debt_id:
          # str(uuid) of the debt row, not a pid.
          type: string
        debtor:
          # A pid, falling back to a stringified participant UUID when the pid lookup misses
          # (`str(pid_by_id.get(debt.debtor_id, debt.debtor_id))`).
          type: string
        creditor:
          type: string
        amount:
          # NOT this edge's own amount. `clear_amount` is the cycle-wide amount cleared on every
          # edge and is loop-invariant, so every edge in one row carries the identical string.
          # Money stays an exact decimal string (AGENTS.md section 8).
          type: string

    IntegrityAuditLogDriftItem:
      # Built by audit_tick_balance (app/core/simulator/post_tick_audit.py:248-255) and copied
      # verbatim into both affected_participants.drifts and error_details.drifts.
      #
      # Four keys, not five: this is NOT the drift item declared inline under
      # PaymentError.details, which is built by the payment engine
      # (app/core/payments/engine.py:1575-1586) and additionally carries `participant_uuid`.
      # Two producers, two shapes, same field name - kept apart deliberately.
      type: object
      required: [participant_id, expected_delta, actual_delta, drift]
      additionalProperties: false
      properties:
        participant_id:
          # str(pid) - the post-tick auditor keys by pid and never emits the UUID.
          type: string
        expected_delta:
          type: string
        actual_delta:
          type: string
        drift:
          # actual - expected, as an exact decimal string. Only participants whose |drift|
          # exceeds 1e-8 are listed at all.
          type: string

    IntegrityAuditLogAffectedParticipants:
      # Six writer shapes in one flat statement rather than a `oneOf`: this is a JSON column of a
      # historical log, and a closed union would make an old row non-conforming. No key is
      # required, because INTEGRITY_VERIFY writes `{}` (app/api/v1/integrity.py:272) - it audits
      # an equivalent, not a set of participants.
      #
      #   TRUST_LINE_CREATE         {from, to}
      #   TRUST_LINE_UPDATE/CLOSE   {from, to, trustline_id}
      #   PAYMENT                   {participants}
      #   CLEARING                  {participants, edges}
      #   SIMULATOR_AUDIT_DRIFT     {drifts, tick_index, source}
      #   INTEGRITY_VERIFY          {}
      type: object
      additionalProperties: true
      properties:
        from:
          # Creditor side of the trust line. CREATE writes `from_participant.pid`; UPDATE and
          # CLOSE write `str(from_pid or trustline.from_participant_id)`, so on those two a
          # missing participant row degrades to a stringified UUID.
          type: string
        to:
          type: string
        trustline_id:
          # str(uuid). TRUST_LINE_UPDATE and TRUST_LINE_CLOSE only - CREATE does not write it.
          type: string
        participants:
          # PAYMENT: `sorted(participant_pids)`, the pids collected off the routed paths.
          # CLEARING: the cycle's participants, each a pid or a stringified UUID fallback.
          # Neither writer deduplicates further than the set it built from.
          type: array
          items:
            type: string
        edges:
          # CLEARING only.
          type: array
          items:
            $ref: '#/components/schemas/IntegrityAuditLogClearingEdge'
        drifts:
          # SIMULATOR_AUDIT_DRIFT only; the same list also lands in error_details.drifts.
          type: array
          items:
            $ref: '#/components/schemas/IntegrityAuditLogDriftItem'
        tick_index:
          type: integer
          minimum: 0
        source:
          # The single literal the orchestrator passes. The SSE audit.drift event admits
          # `delta_check` as well; this writer does not.
          type: string
          enum: [post_tick_audit]

    IntegrityAuditLogCheckResult:
      # The value of one key of `invariants_checked`. Two producers write into the same slot:
      #
      # * the five checkpoint writers store `invariants_status["checks"]`
      #   (app/core/integrity.py:79-114), whose entries are `{passed}` or
      #   `{passed, violations, details}` - the `value` key never appears;
      # * INTEGRITY_VERIFY stores `{k: v.model_dump() for k, v in invariants.items()}`
      #   (app/api/v1/integrity.py:273), and a plain model_dump of InvariantResult has no
      #   exclude_none, so ALL FOUR keys are present with explicit nulls.
      #
      # Only `passed` is common to both, so only `passed` is required. This is deliberately not
      # a `$ref` to InvariantResult nor to IntegrityInvariantChecks: the checkpoint entries would
      # fail InvariantResult's shape expectations and the verify dump is a different producer.
      type: object
      required: [passed]
      additionalProperties: true
      properties:
        passed:
          type: boolean
        value:
          # INTEGRITY_VERIFY only. The string "0" on the zero_sum pass path
          # (app/api/v1/integrity.py:211), null everywhere else - including on every
          # trust_limits and debt_symmetry entry.
          type: string
          nullable: true
        violations:
          # Absent on the checkpoint zero_sum entry (that check has no count to report, on either
          # path); present and null on the INTEGRITY_VERIFY zero_sum entry.
          type: integer
          nullable: true
          minimum: 0
        details:
          # Null when passed; otherwise the .details of the IntegrityViolationException, copied
          # through unchanged by both producers - the same three variants the integrity endpoints
          # return.
          oneOf:
            - $ref: '#/components/schemas/InvariantViolationDetails'
            # NOT `nullable: true` beside the oneOf. In OpenAPI 3.0 `nullable` only widens
            # `type`, so on a schema that declares no `type` it admits nothing - measured
            # 2026-08-23 against openapi-schema-validator, where the pass-path `details: null`
            # this endpoint really returns is rejected. The null needs a branch of its own.
            - nullable: true
              enum: [null]

    IntegrityAuditLogPostTickBalance:
      # SIMULATOR_AUDIT_DRIFT's own single-key vocabulary
      # (app/core/simulator/real_tick_orchestrator.py:469-474). It shares no key name with the
      # three protocol invariants.
      type: object
      required: [passed, total_drift]
      additionalProperties: true
      properties:
        passed:
          # Always false. The writer runs only on the `not audit.ok` branch, so a passing
          # post-tick balance never produces a row at all.
          type: boolean
        total_drift:
          # sum(|drift|) / 2 as an exact decimal string.
          type: string

    IntegrityAuditLogInvariantsChecked:
      # A map from check name to outcome. Nothing is required: CLEARING writes `{}` whenever the
      # after-checkpoint computation was swallowed (app/core/clearing/service.py:1726-1747,
      # `invariants_status.get("checks") or invariants_status` over an empty dict), and
      # SIMULATOR_AUDIT_DRIFT writes only `post_tick_balance`.
      #
      # The documented fallback to the whole `invariants_status` object is not reachable in
      # practice: the sole writer of that column always sets a truthy three-key `checks`
      # (app/core/integrity.py:117), so the `or` arm only ever yields `{}`.
      type: object
      additionalProperties: true
      properties:
        zero_sum:
          $ref: '#/components/schemas/IntegrityAuditLogCheckResult'
        trust_limits:
          $ref: '#/components/schemas/IntegrityAuditLogCheckResult'
        debt_symmetry:
          $ref: '#/components/schemas/IntegrityAuditLogCheckResult'
        post_tick_balance:
          $ref: '#/components/schemas/IntegrityAuditLogPostTickBalance'

    # REPLACEMENT of the existing InvariantResult. Only `details` changes, and only in the way
    # described below: without it a real INTEGRITY_VERIFY row cannot conform, because every
    # passing invariant in error_details.invariants carries `details: null`. The same one-line
    # class is still open on IntegrityInvariantChecks.{zero_sum,trust_limits,debt_symmetry}
    # .details, which this slice does not reach - see the programme note.

    IntegrityAuditLogVerifyError:
      # error_details as INTEGRITY_VERIFY writes it (app/api/v1/integrity.py:275-281).
      type: object
      required: [status, checked_at, invariants]
      additionalProperties: true
      properties:
        status:
          # `healthy` is impossible here: this object is written only on the `not passed` arm,
          # and passed is `status == "healthy"`.
          type: string
          enum: [warning, critical]
        checked_at:
          # `_now().isoformat()` frozen into JSON at write time, so it ends in `+00:00` - unlike
          # the sibling `timestamp` on the enclosing item, which pydantic renders with `Z`.
          # See the note on IntegrityAuditLogItem.timestamp.
          type: string
          format: date-time
        invariants:
          # Always all three: the verify loop assigns every key on both its pass and its fail
          # path (app/api/v1/integrity.py:205-245). These really are InvariantResult dumps, so
          # the existing component is reused here rather than IntegrityAuditLogCheckResult.
          type: object
          required: [zero_sum, trust_limits, debt_symmetry]
          additionalProperties:
            $ref: '#/components/schemas/InvariantResult'
          properties:
            zero_sum:
              $ref: '#/components/schemas/InvariantResult'
            trust_limits:
              $ref: '#/components/schemas/InvariantResult'
            debt_symmetry:
              $ref: '#/components/schemas/InvariantResult'

    IntegrityAuditLogDriftError:
      # error_details as SIMULATOR_AUDIT_DRIFT writes it
      # (app/core/simulator/real_tick_orchestrator.py:476-479).
      type: object
      required: [drifts, severity]
      additionalProperties: true
      properties:
        drifts:
          # The same list as affected_participants.drifts on the same row - stored twice.
          type: array
          items:
            $ref: '#/components/schemas/IntegrityAuditLogDriftItem'
        severity:
          # `warning` when total_drift is under 1% of the tick volume, `critical` otherwise and
          # whenever the ratio cannot be computed (app/core/simulator/real_tick_orchestrator.py
          # :413-421).
          type: string
          enum: [warning, critical]
