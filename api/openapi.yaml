      tags: [Admin]
      summary: Abort transaction (admin)
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema:
            type: string
        - in: path
          name: tx_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Aborted
          content:
            application/json:
              schema:
