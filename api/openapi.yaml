    TrustLine:
      type: object
      # 011/T1102 (2026-08-23): `required` named six of the ten fields the model declares
      # without a default, and `updated_at` was missing from `properties` altogether even
      # though every trustline read emits it (app/schemas/trustline.py:23). The three fields
      # left out - policy, from_display_name, to_display_name - default to null in the model,
      # so nothing guarantees them; no read sets response_model_exclude_none, so in practice
      # all three do reach the wire.
      #
      # Present, but not null, and the first version of this note said null on all three. The
      # wire test corrected it: `policy` is `{}`, never null, because TrustLineService.create
      # writes `policy=data.policy or {}` (app/core/trustlines/service.py:190) - which also means
      # the ORM column's five-key default (app/db/models/trustline.py:15-21) never fires for an
      # API-created line. The two display names are non-null wherever the query joins the
      # participant rows, and null only on the metrics capacity path, exactly as
      # AdminParticipantCapacityBottleneck says of itself.
      required: [id, from, to, equivalent, limit, used, available, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: TrustLine UUID
        from:
          type: string
          description: PID of trustline creator (creditor)
        to:
          type: string
          description: PID of trustee (potential debtor)
        from_display_name:
          type: string
          nullable: true
        to_display_name:
          type: string
          nullable: true
        equivalent:
          $ref: '#/components/schemas/EquivalentCode'
        limit:
          type: string
          description: Maximum debt allowed (decimal string)
        used:
          type: string
          description: Current debt against this line (decimal string)
        available:
          type: string
          description: Available credit (limit - used)
        policy:
          type: object
          additionalProperties: true
          # 011/T1102: the five keys were named in the description but never declared, so a
          # generated client got nothing typed. `additionalProperties` stays true on
          # purpose (`F-011-8`): validate_trustline_policy rejects unknown keys on
          # POST/PATCH /trustlines, but the simulator scenario seeder writes arbitrary
          # JSON into the same column without calling it, and those rows are served by
          # these same responses.
          properties:
            auto_clearing:
              type: boolean
              nullable: true
            can_be_intermediate:
              type: boolean
              nullable: true
            max_hop_usage:
              # The validator parses with Decimal(str(value)) and requires >= 0, so a numeric
              # string and a number are both accepted (app/utils/validation.py:212-219).
              #
              # An explicit null is ACCEPTED too, and that is why the null branch is spelled out
              # here on the read schema and on both write schemas alike.
              # `validate_trustline_policy` skips the key outright when the value is null -
              # `if key not in policy or policy[key] is None: continue`
              # (app/utils/validation.py:210-211) - and the service then stores the policy dict
              # verbatim into the JSON column (app/core/trustlines/service.py:190, :334-336), so
              # a null written through POST/PATCH /trustlines is read straight back out by every
              # TrustLine response.
              #
              # A BRANCH, not a sibling `nullable: true`: in OpenAPI 3.0.3 `nullable` modifies a
              # sibling `type` and nothing else, so beside a bare `oneOf` it was inert and this
              # node forbade the null it claimed to allow (`F-011-10`).
              oneOf:
                - type: string
                - type: number
                - nullable: true
                  enum: [null]
            daily_limit:
              # Same validator branch, same accepted-and-persisted null.
              oneOf:
                - type: string
                - type: number
                - nullable: true
                  enum: [null]
            blocked_participants:
              type: array
              nullable: true
              items:
                type: string
          description: |
            TrustLine policy settings.

            Allowed keys (MVP): `auto_clearing`, `can_be_intermediate`, `max_hop_usage`, `daily_limit`, `blocked_participants`.

            Note: `daily_limit` is **informational only** and is **not enforced in MVP**.
        status:
          type: string
          enum: [active, frozen, closed]
          description: TrustLine status
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

