          # Read back verbatim from the transactions.error JSON column
          # (app/core/payments/service.py:1282-1286). The payment engine's abort writer coerces a
          # missing payload to {} (app/core/payments/engine.py:1761-1778), so a row it wrote
          # always carries an object.
          #
          # It is NOT the only writer, which is why the null branch below is real rather than a
          # concession to hypothetical legacy rows: `scripts/seed_db.py:459` stores
          # `error=item.get("error")` straight from a fixtures pack, bypassing that normalizer
          # entirely, and the shipped pack's ABORTED rows carry `{"code", "message"}` with no
          # `details` key at all (admin-fixtures/.../transactions.json:29, :346). For those rows
          # `.get("details")` yields None and `PaymentError` serializes `"details": null`
          # (executed; `details` is `Optional[Dict[str, Any]] = None` on app/schemas/payment.py:57
          # and no read on this route sets `exclude_none`).
          #
          # The tail is OPEN, and that is the point: both abort paths forward the `.details` of
          # whatever 4xx GeoException prepare or commit raised. The prepare path classifies at
          # app/core/payments/service.py:898-903 and writes at :922 and :938; the commit path
          # forwards at :1001, :1017, :1067 and :1083. (One 896-903 range used to stand for all of
          # that; T1108 found it covering a single branch of two and starting mid-expression.)
          # So adding a `details=` to any 4xx raise changes this object with no schema change.
          # The branches below therefore DOCUMENT what the code emits today. `anyOf`, never
          # `oneOf`: a closed union would make an unlisted-but-real response non-conforming, and
          # a `oneOf` with a catch-all is worse still - every documented payload would match two
          # branches and be rejected for matching more than one.
          #
          # The null is the last branch rather than a sibling `nullable: true`. In OpenAPI 3.0.3
          # `nullable` modifies a sibling `type` and nothing else, so beside a bare `anyOf` it was
          # inert and this node rejected the null it claimed to allow (`F-011-10`).
          anyOf:
            # Plain abort with no diagnostic payload - cancellation and timeout (E007), the
            # default abort (E010), and the E002 raised when routing finds no capacious path.
            - type: object
              additionalProperties: false
            # E002, insufficient capacity on one hop (app/core/payments/engine.py:767, :949).
            # available / needed / reserved are money, so exact decimal strings.
            - type: object
              required: [available, needed, reserved, from, to]
              properties:
                available:
                  type: string
                needed:
                  type: string
                reserved:
                  type: string
                from:
                  type: string
                to:
                  type: string
              additionalProperties: false
            # E008 from RetryablePaymentConflictException (app/utils/exceptions.py:78-81):
            # a retryable database serialization failure. `retryable` is the client-facing
            # signal that the same payment may be resubmitted.
            - type: object
              required: [retryable, conflict_kind]
              properties:
                retryable:
                  type: boolean
                conflict_kind:
                  type: string
              additionalProperties: false
            # E008 from the post-apply per-participant delta check
            # (app/core/payments/engine.py:1594). `equivalent` is deliberately a plain string,
            # NOT EquivalentCode: the producer falls back to the equivalent UUID when the code
            # cannot be read, and the code pattern would reject a real response.
            - type: object
              required: [invariant, source, equivalent, equivalent_id, total_drift, drifts]
              properties:
                invariant:
                  type: string
                  enum: [PAYMENT_DELTA_DRIFT]
                source:
                  type: string
                equivalent:
                  type: string
                equivalent_id:
                  type: string
                total_drift:
                  type: string
                drifts:
                  type: array
                  items:
                    type: object
                    required: [participant_id, participant_uuid, expected_delta, actual_delta, drift]
                    properties:
                      participant_id:
                        type: string
                      participant_uuid:
                        type: string
                      expected_delta:
                        type: string
                      actual_delta:
                        type: string
                      drift:
                        type: string
                    additionalProperties: false
              additionalProperties: false
            # E008 from the three protocol invariants re-checked before commit - the same three
            # shapes the integrity endpoints return, from the same producers.
            - $ref: '#/components/schemas/InvariantViolationDetails'
            # The open tail. Any other 4xx GeoException raised in prepare or commit reaches this
            # node with its own details; this branch is what keeps such a response conforming.
            - type: object
            # The seeded abort rows described above, which carry no `details` key at all.
            - nullable: true
              enum: [null]

    PaymentResult:
      type: object
      required: [tx_id, status, from, to, equivalent, amount, created_at]
      properties:
        tx_id:
          type: string
        status:
          type: string
          enum: [COMMITTED, ABORTED]
          description: Final payment outcome. Internal transaction states are not exposed via the Payments API.
        from:
          type: string
        to:
          type: string
        equivalent:
          $ref: '#/components/schemas/EquivalentCode'
        amount:
          type: string
        routes:
          # All three of the nodes below are present-and-null on ordinary responses, and all
          # three were declared as though they never could be. An ordinary SUCCESSFUL payment
          # is the counter-example, not an edge case.
          #
          # `routes`: `get_payment` sets it to None whenever the stored payload carries no
          # routes, and again when the list comes out empty (`or None`,
          # app/core/payments/service.py:1275-1277). `nullable` beside `type: array` is the
          # honest spelling here - unlike beside a `$ref`, it does exactly what it looks like.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PaymentRoute'
        error:
          # A successful payment sends `error: null`: the COMMITTED result at
          # app/core/payments/service.py:1206-1215 is built without an `error=` at all, and the
          # field defaults to None (app/schemas/payment.py:67). `get_payment` does the same
          # explicitly at :1280. This was a bare `$ref`, whose siblings 3.0.3 ignores, so the
          # null branch has to be a member of a composition.
          oneOf:
            - $ref: '#/components/schemas/PaymentError'
            - nullable: true
              enum: [null]
        created_at:
          type: string
          format: date-time
        committed_at:
          # Null on any result that is not COMMITTED, and on a COMMITTED one whose transaction
          # row has not been read back: `committed_at = tx.updated_at if tx.state ==
          # "COMMITTED" else None` (app/core/payments/service.py:1279), and the commit path
          # leaves it None unless the readback at :1196-1200 finds the row.
          type: string
          format: date-time
          nullable: true

    PaymentsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResult'

    BalanceEquivalent:
      type: object
      required: [code, total_debt, total_credit, net_balance, available_to_spend, available_to_receive]
      properties:
        code:
          $ref: '#/components/schemas/EquivalentCode'
        total_debt:
          type: string
        total_credit:
          type: string
        net_balance:
          type: string
        available_to_spend:
          type: string
        available_to_receive:
          type: string

    BalanceSummary:
      type: object
      required: [equivalents]
      properties:
        equivalents:
          type: array
          items:
            $ref: '#/components/schemas/BalanceEquivalent'

    DebtsDetails:
      type: object
      required: [outgoing, incoming]
      properties:
        outgoing:
          type: array
          items:
            type: object
            required: [creditor, equivalent, amount]
            properties:
              creditor:
                type: string
              creditor_name:
                type: string
              equivalent:
                $ref: '#/components/schemas/EquivalentCode'
              amount:
                type: string
        incoming:
          type: array
          items:
            type: object
            required: [debtor, equivalent, amount]
            properties:
              debtor:
                type: string
              debtor_name:
                type: string
              equivalent:
                $ref: '#/components/schemas/EquivalentCode'
              amount:
                type: string

    IntegrityInvariantChecks:
      # All three checks always run and always record an outcome, so all three keys are present
      # whenever `checks` is (app/core/integrity.py:79-114). The value shapes deliberately are not
      # one shared schema: zero_sum has no violation count to report and never writes a
      # `violations` key - not on the pass path and not on the failure path either.
      type: object
      required: [zero_sum, trust_limits, debt_symmetry]
      additionalProperties: true
      properties:
        zero_sum:
          type: object
          required: [passed]
          additionalProperties: true
          properties:
            passed:
              type: boolean
            details:
              # Absent or an object - never null, unlike the `details` on InvariantResult below.
              # This node is a plain dict literal, not a pydantic model, so an unset key is simply
              # missing: the pass path writes `{"passed": true}` / `{"passed": true,
              # "violations": 0}` and no `details` at all, and the failure path writes
              # `exc.details`, which every raise in app/core/invariants.py supplies as a dict
              # (app/core/integrity.py:79-114). The `nullable: true` that stood here was untrue,
              # and inert besides - in OpenAPI 3.0.3 `nullable` modifies a sibling `type` and
              # nothing else, so beside a bare `oneOf` it stated nothing (`F-011-10`).
              oneOf:
                - $ref: '#/components/schemas/InvariantViolationDetails'
        trust_limits:
          type: object
          required: [passed, violations]
          additionalProperties: true
          properties:
            passed:
              type: boolean
            violations:
              type: integer
              minimum: 0
            details:
              # Absent or an object - never null, unlike the `details` on InvariantResult below.
              # This node is a plain dict literal, not a pydantic model, so an unset key is simply
              # missing: the pass path writes `{"passed": true}` / `{"passed": true,
              # "violations": 0}` and no `details` at all, and the failure path writes
              # `exc.details`, which every raise in app/core/invariants.py supplies as a dict
              # (app/core/integrity.py:79-114). The `nullable: true` that stood here was untrue,
              # and inert besides - in OpenAPI 3.0.3 `nullable` modifies a sibling `type` and
              # nothing else, so beside a bare `oneOf` it stated nothing (`F-011-10`).
              oneOf:
                - $ref: '#/components/schemas/InvariantViolationDetails'
        debt_symmetry:
          type: object
          required: [passed, violations]
          additionalProperties: true
          properties:
            passed:
              type: boolean
            violations:
              type: integer
              minimum: 0
            details:
              # Absent or an object - never null, unlike the `details` on InvariantResult below.
              # This node is a plain dict literal, not a pydantic model, so an unset key is simply
              # missing: the pass path writes `{"passed": true}` / `{"passed": true,
              # "violations": 0}` and no `details` at all, and the failure path writes
              # `exc.details`, which every raise in app/core/invariants.py supplies as a dict
              # (app/core/integrity.py:79-114). The `nullable: true` that stood here was untrue,
              # and inert besides - in OpenAPI 3.0.3 `nullable` modifies a sibling `type` and
              # nothing else, so beside a bare `oneOf` it stated nothing (`F-011-10`).
              oneOf:
                - $ref: '#/components/schemas/InvariantViolationDetails'

    IntegrityInvariantsStatus:
      # The `invariants_status` JSON column, handed back verbatim by
      # GET /integrity/checksum/{equivalent} (app/api/v1/integrity.py:178). Sole writer:
      # compute_integrity_checkpoint_for_equivalent (app/core/integrity.py:58-124).
      #
      # Only the five keys of the opening literal are required. The status/checks/alerts/passed
      # block was added later, so rows written before it carry the five base keys and nothing
      # else - and a JSON column keeps whatever it was given, which is also why this stays open.
      type: object
      required: [computed_at, debts_count, trustlines_count, debts_non_negative, debts_negative_count]
      additionalProperties: true
      properties:
        computed_at:
          # `datetime.now(timezone.utc).isoformat()` frozen into JSON, not a datetime rendered by
          # the response model - so it ends in `+00:00`, unlike every timestamp pydantic emits.
          type: string
          format: date-time
        debts_count:
          type: integer
          minimum: 0
        trustlines_count:
          type: integer
          minimum: 0
        debts_non_negative:
          type: boolean
        debts_negative_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [healthy, warning, critical]
        checks:
          $ref: '#/components/schemas/IntegrityInvariantChecks'
        alerts:
          # Bare check names, one per failed check - a different vocabulary from the
          # sentence-style alerts on IntegrityStatusResponse.
          type: array
          items:
            type: string
            enum: [zero_sum, trust_limits, debt_symmetry]
        passed:
          type: boolean

    IntegrityAuditLogAfterState:
      # Not a stored blob: the handler builds this dict field by field from an
      # integrity_audit_log row (app/api/v1/integrity.py:504-514), so all nine keys are always
      # present however old the row is.
      type: object
      additionalProperties: true
      required:
        - operation_type
        - tx_id
        - equivalent
        - state_checksum_before
        - state_checksum_after
        - affected_participants
        - invariants_checked
        - verification_passed
        - error_details
      properties:
        operation_type:
          # The seven writers. This value selects the shape of the three open objects below.
          type: string
          enum:
            - TRUST_LINE_CREATE
            - TRUST_LINE_UPDATE
            - TRUST_LINE_CLOSE
            - INTEGRITY_VERIFY
            - PAYMENT
            - CLEARING
            - SIMULATOR_AUDIT_DRIFT
        tx_id:
          # Only PAYMENT and CLEARING run inside a transaction; the other five write null.
          type: string
          nullable: true
        equivalent:
          # An equivalent code in practice, but deliberately not EquivalentCode: three writers
          # fall back to a stringified UUID when the code lookup misses, which the code pattern
          # would reject.
          type: string
        state_checksum_before:
          # sha-256 hex, or the empty string: the column is NOT NULL, so "no prior checkpoint"
          # is spelled "" rather than null.
          type: string
          pattern: '^([0-9a-f]{64})?$'
        state_checksum_after:
          type: string
          pattern: '^([0-9a-f]{64})?$'
        affected_participants:
          $ref: '#/components/schemas/IntegrityAuditLogAffectedParticipants'
        invariants_checked:
          $ref: '#/components/schemas/IntegrityAuditLogInvariantsChecked'
        verification_passed:
          type: boolean
        error_details:
          # Null exactly when verification_passed is true - with one exception:
          # SIMULATOR_AUDIT_DRIFT hard-codes verification_passed false and always writes a body.
          #
          # A `oneOf` is safe here where it was not for affected_participants, because the four
          # branches are told apart by their required keys alone; none of them has to forbid
          # additional keys, so an unexpected key on an old row still conforms.
          oneOf:
            # The five checkpoint writers store the whole `invariants_status` object.
            - $ref: '#/components/schemas/IntegrityInvariantsStatus'
            - $ref: '#/components/schemas/IntegrityAuditLogVerifyError'
            - $ref: '#/components/schemas/IntegrityAuditLogDriftError'
            # Two real values in one branch: `null` on every passing row, and the empty object
            # that CLEARING stores when its after-checkpoint was swallowed (invariants_status is
            # `{}`, so `passed` is false and `{}` itself is written). `nullable` sits here rather
            # than beside the `oneOf` because in OpenAPI 3.0 it only widens `type` - see the note
            # on IntegrityAuditLogCheckResult.details.
            - type: object
              nullable: true
              additionalProperties: false

    InvariantViolationDetails:
      # The payload IntegrityViolationException carries (app/core/invariants.py).
      # Shared because two surfaces return exactly these three shapes: the integrity
      # endpoints via InvariantResult.details, and a payment abort via
      # PaymentError.details when the engine re-checks invariants before commit
      # (app/core/payments/engine.py:1248-1255).
      oneOf:
      # check_zero_sum. Keys are equivalent ids, values the signed imbalance - money, so
      # exact decimal strings (AGENTS.md section 8), never numbers.
      - type: object
        required: [invariant, violations]
        properties:
          invariant:
            type: string
            enum: [ZERO_SUM_VIOLATION]
          violations:
            type: object
            additionalProperties:
              type: string
        additionalProperties: false
      # check_trust_limits, item built at app/core/invariants.py:136-145.
      - type: object
        required: [invariant, violations]
        properties:
          invariant:
            type: string
            enum: [TRUST_LIMIT_VIOLATION]
          violations:
            type: array
            items:
              type: object
              required: [debtor_id, creditor_id, equivalent_id, debt_amount, trust_limit, violation_amount]
              properties:
                debtor_id:
                  type: string
                creditor_id:
                  type: string
                equivalent_id:
                  type: string
                debt_amount:
                  type: string
                trust_limit:
                  type: string
                violation_amount:
                  type: string
              additionalProperties: false
        additionalProperties: false
      # check_debt_symmetry, item built at app/core/invariants.py:218-227.
      - type: object
        required: [invariant, violations]
        properties:
          invariant:
            type: string
            enum: [DEBT_SYMMETRY_VIOLATION]
          violations:
            type: array
            items:
              type: object
              required: [participant_a, participant_b, equivalent_id, debt_a_to_b, debt_b_to_a, net_debt]
              properties:
                participant_a:
                  type: string
                participant_b:
                  type: string
                equivalent_id:
                  type: string
                debt_a_to_b:
                  type: string
                debt_b_to_a:
                  type: string
                net_debt:
                  type: string
              additionalProperties: false
        additionalProperties: false

    InvariantResult:
      type: object
      required: [passed]
      properties:
        passed:
          type: boolean
        value:
          type: string
          nullable: true
        violations:
          type: integer
          nullable: true
        details:
          # Null when `passed` is true; otherwise the details of the IntegrityViolationException,
          # copied through unchanged by the two endpoints that build this object
          # (app/api/v1/integrity.py:108, :121, :135 and :213, :226, :240). So the shape here is
          # exactly what app/core/invariants.py raises: three variants, told apart by `invariant`.
          #
          # `violations` is an OBJECT in the zero-sum variant and an ARRAY in the other two. That
          # asymmetry is in the producers, not a transcription slip - which is why this is a
          # oneOf of three whole objects rather than one object with a loose `violations`.
          #
          # CLEARING_NEUTRALITY_VIOLATION (app/core/invariants.py:284-287) is deliberately absent:
          # verify_clearing_neutrality has one caller, the clearing service, and its exception
          # never becomes an InvariantResult. Declaring a shape this endpoint cannot return would
          # be the mirror of the defect program 011 exists to fix.
          #
          # The null is a BRANCH here, and it is the ordinary case: this IS a pydantic model
          # (`details: Optional[Dict[str, Any]] = None`, app/schemas/integrity.py:19) and no read
          # on either endpoint sets `exclude_none`, so every PASSING invariant emits
          # `"details": null` (executed). A sibling `nullable: true` could not say that - in
          # OpenAPI 3.0.3 it modifies a sibling `type` and nothing else, so beside a bare `oneOf`
          # it was inert and rejected the null it claimed to allow (`F-011-10`).
          oneOf:
            - $ref: '#/components/schemas/InvariantViolationDetails'
            - nullable: true
              enum: [null]
      additionalProperties: false

    EquivalentIntegrityStatus:
      type: object
      required: [status, checksum, invariants]
      properties:
        status:
          type: string
          enum: [healthy, warning, critical]
        checksum:
          type: string
        last_verified:
          type: string
          format: date-time
