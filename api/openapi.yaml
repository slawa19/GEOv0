          $ref: '#/components/responses/SimulatorActionForbidden'
        '404':
          $ref: '#/components/responses/SimulatorActionNotFound'
        '422':
          $ref: '#/components/responses/SimulatorActionUnprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/runs/{run_id}/actions/trustlines-list:
    get:
      tags: [Simulator]
      summary: List trust lines inside a run (Interact Mode)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - in: query
          name: equivalent
          required: false
          schema:
            type: string
        - in: query
          name: participant_pid
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Trust lines of the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionTrustlinesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SimulatorActionForbidden'
        '404':
          $ref: '#/components/responses/SimulatorActionNotFound'
        '422':
          $ref: '#/components/responses/SimulatorActionUnprocessable'
        '503':
          description: Action unavailable - SEEDING_FAILED (flat envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/runs/{run_id}/payment-targets:
    get:
      tags: [Simulator]
      summary: List reachable payment targets for a participant (Interact Mode)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - in: query
          name: equivalent
          required: true
          schema:
            type: string
        - in: query
          name: from_pid
          required: true
          schema:
            type: string
        - in: query
          name: max_hops
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 6
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - in: query
          name: include_max_available
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Reachable payment targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorPaymentTargetsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SimulatorActionForbidden'
        '404':
          $ref: '#/components/responses/SimulatorActionNotFound'
        '422':
          $ref: '#/components/responses/SimulatorActionUnprocessable'
        '503':
          description: Action unavailable - SEEDING_FAILED (flat envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PidPath:
      in: path
      name: pid
      required: true
      schema:
        type: string
    TrustLineIdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
        description: TrustLine UUID

    ScenarioIdPath:
      in: path
      name: scenario_id
      required: true
      schema:
        type: string

    RunIdPath:
      in: path
      name: run_id
      required: true
      schema:
        type: string

    ArtifactNamePath:
      in: path
      name: name
      required: true
      schema:
        type: string

    EquivalentQuery:
      in: query
      name: equivalent
      required: true
      schema:
        $ref: '#/components/schemas/EquivalentCode'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: >-
        Measured data is unavailable and the endpoint refuses to substitute
        synthetic data (real-mode simulator analytics).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    SimulatorActionBadRequest:
      description: Invalid request payload for the action (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionForbidden:
      description: >-
        Actions disabled or access denied (flat SimulatorActionError), or the identity was
        rejected before the handler ran (ErrorEnvelope). Both shapes are reachable: the guard
        inside the handler answers flat, while require_simulator_actor raises before it and the
        global handler wraps the result.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SimulatorActionError'
              - $ref: '#/components/schemas/ErrorEnvelope'
    SimulatorActionNotFound:
      description: Run, participant, equivalent or trustline not found (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionConflict:
      description: Run is terminal, or the action conflicts with current state (flat envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimulatorActionError'
    SimulatorActionUnprocessable:
      description: Invalid simulator identity transport (for example, X-Simulator-Owner)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # Interact Mode control plane payloads (011/T1101, added 2026-08-23).
    # Money-carrying fields (limit, used, available, amount, cleared amounts) are exact
    # decimal strings, per AGENTS.md section 8 - never floats.
    SimulatorActionTrustlineCreateRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent, limit]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineCreateResponse:
      type: object
      additionalProperties: false
      required: [trustline_id, from_pid, to_pid, equivalent, limit]
      properties:
        ok:
          type: boolean
          default: true
        trustline_id:
          type: string
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineUpdateRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent, new_limit]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        new_limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineUpdateResponse:
      type: object
      additionalProperties: false
      required: [trustline_id, old_limit, new_limit]
      properties:
        ok:
          type: boolean
          default: true
        trustline_id:
          type: string
        old_limit:
          type: string
        new_limit:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineCloseRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionTrustlineCloseResponse:
      type: object
      additionalProperties: false
      required: [trustline_id]
      properties:
        ok:
          type: boolean
          default: true
        trustline_id:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionPaymentRealRequest:
      type: object
      additionalProperties: false
      required: [from_pid, to_pid, equivalent, amount]
      properties:
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        amount:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionPaymentRealResponse:
      type: object
      additionalProperties: false
      required: [payment_id, from_pid, to_pid, equivalent, amount, status]
      properties:
        ok:
          type: boolean
          default: true
        payment_id:
          type: string
        from_pid:
          type: string
        to_pid:
          type: string
        equivalent:
          type: string
        amount:
          type: string
        status:
          type: string
        client_action_id:
          type: string
          nullable: true

    SimulatorActionClearingRealRequest:
      type: object
      additionalProperties: false
      required: [equivalent]
      properties:
        equivalent:
          type: string
        max_depth:
          type: integer
          minimum: 1
          maximum: 12
          default: 6
        client_action_id:
          type: string
          nullable: true

    SimulatorActionClearingRealResponse:
      type: object
      additionalProperties: false
      required: [equivalent, cleared_cycles, total_cleared_amount, cycles]
      properties:
        ok:
          type: boolean
          default: true
        equivalent:
          type: string
        cleared_cycles:
          type: integer
          minimum: 0
        total_cleared_amount:
          type: string
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorActionClearingCycle'
        client_action_id:
          type: string
          nullable: true

    SimulatorActionClearingCycle:
      type: object
      additionalProperties: false
      required: [cleared_amount, edges]
      properties:
        cleared_amount:
          type: string
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorActionEdgeRef'

    SimulatorActionParticipantItem:
      type: object
      additionalProperties: false
      required: [pid, name, type, status]
      properties:
        pid:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string

    SimulatorActionParticipantsListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorActionParticipantItem'

    SimulatorActionTrustlineListItem:
      type: object
      additionalProperties: false
      required: [from_pid, from_name, to_pid, to_name, equivalent, limit, used, reverse_used, available, status]
      properties:
        from_pid:
          type: string
        from_name:
          type: string
        to_pid:
          type: string
        to_name:
          type: string
        equivalent:
          type: string
        limit:
          type: string
        used:
          type: string
        reverse_used:
          type: string
        available:
          type: string
        status:
          type: string

    SimulatorActionTrustlinesListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorActionTrustlineListItem'

    SimulatorPaymentTargetsItem:
      type: object
      additionalProperties: false
      required: [to_pid, hops]
      properties:
        to_pid:
          type: string
        hops:
          type: integer
          minimum: 1
        max_available:
          type: string
          nullable: true

    SimulatorPaymentTargetsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorPaymentTargetsItem'

    SimulatorActionEdgeRef:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    SimulatorActionError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

    TxOnceRequestBody:
      type: object
      required: [equivalent]
      properties:
        equivalent:
          type: string
        from:
          type: string
          nullable: true
        to:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        ttl_ms:
          type: integer
          nullable: true
        intensity_key:
          type: string
          nullable: true
        seed:
          nullable: true
        client_action_id:
          type: string
          nullable: true

    TxOnceResponseBody:
      type: object
      required: [emitted_event_id]
      properties:
        ok:
          type: boolean
          default: true
        emitted_event_id:
          type: string
        client_action_id:
          type: string
          nullable: true

    ClearingOnceRequestBody:
      type: object
      required: [equivalent]
      properties:
        equivalent:
          type: string
        cycle_edges:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties:
              type: string
        cleared_amount:
          type: string
          nullable: true
        seed:
          nullable: true
        client_action_id:
          type: string
          nullable: true

    ClearingOnceResponseBody:
      type: object
      required: [plan_id, done_event_id]
      properties:
        ok:
          type: boolean
          default: true
        plan_id:
          type: string
        done_event_id:
          type: string
        client_action_id:
          type: string
          nullable: true

    Equivalent:
      type: object
      required: [code, precision, is_active, created_at, updated_at]
      properties:
        code:
          $ref: '#/components/schemas/EquivalentCode'
        symbol:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        precision:
          type: integer
          minimum: 0
          maximum: 18
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoredEquivalent:
      description: Read projection that keeps pre-contract rows visible to operators.
      type: object
      required: [code, precision, is_active, created_at, updated_at]
      properties:
        code:
          type: string
        symbol:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        precision:
          type: integer
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EquivalentsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoredEquivalent'

    EquivalentCode:
      type: string
      pattern: '^[A-Z0-9_]{1,16}$'
      description: Equivalent code (1-16 chars; A-Z, 0-9, underscore)
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

    AdminConfigItem:
      type: object
      required: [key, value, mutable]
      properties:
        key:
          type: string
        value:
          description: Any JSON value
        mutable:
          type: boolean

    AdminConfigResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminConfigItem'

    AdminConfigPatchRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: object
          additionalProperties: true
        reason:
          type: string
          nullable: true

    AdminConfigPatchResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: array
          items:
            type: string

    AdminFeatureFlags:
      type: object
      required: [multipath_enabled, full_multipath_enabled, clearing_enabled]
      properties:
        multipath_enabled:
          type: boolean
        full_multipath_enabled:
          type: boolean
        clearing_enabled:
          type: boolean
      additionalProperties: false

    AdminFeatureFlagsPatchRequest:
      type: object
      description: Partial patch; only provided fields are updated.
      properties:
        multipath_enabled:
          type: boolean
          nullable: true
        full_multipath_enabled:
          type: boolean
          nullable: true
        clearing_enabled:
          type: boolean
          nullable: true
        reason:
          type: string
          nullable: true

    AdminWhoAmIResponse:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin]

    AdminParticipantActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    # 011/T1102 (2026-08-23): five operations whose bodies the application already described
    # and the canon did not. Transcribed by hand from the response models, in the style of this
    # document - the canon is authority number one, not a build artifact of the code.
    AdminClearingCycleEdge:
      type: object
      required: [equivalent, debtor, creditor, amount]
      properties:
        equivalent:
          type: string
        debtor:
          type: string
        creditor:
          type: string
        amount:
          # Money stays an exact decimal string (AGENTS.md section 8), never a float.
          type: string

    AdminClearingCyclesForEquivalent:
      type: object
      required: [cycles]
      properties:
        cycles:
          # A cycle is an ordered list of edges, so this is an array of arrays.
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/AdminClearingCycleEdge'

    AdminClearingCyclesResponse:
      type: object
      required: [equivalents]
      properties:
        equivalents:
          # Keyed by equivalent code; the key set is data, not contract.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdminClearingCyclesForEquivalent'

    AdminIncidentItem:
      type: object
      required: [tx_id, state, initiator_pid, equivalent, age_seconds, sla_seconds]
      properties:
        tx_id:
          type: string
        state:
          type: string
        initiator_pid:
          type: string
        equivalent:
          type: string
        age_seconds:
          type: integer
          minimum: 0
        sla_seconds:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          nullable: true

    AdminIncidentsListResponse:
      type: object
      required: [page, per_page, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminIncidentItem'

    AdminParticipantListItem:
      type: object
      required: [pid, display_name, type, status, verification_level, created_at]
      properties:
        pid:
          type: string
        display_name:
          type: string
        type:
          type: string
        status:
          type: string
        verification_level:
          type: integer
        created_at:
          type: string
          format: date-time

    AdminParticipantsListResponse:
      type: object
      required: [page, per_page, total, items]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminParticipantListItem'

    AdminParticipantsStatsResponse:
      type: object
      properties:
        participants_by_status:
          type: object
          additionalProperties:
            type: integer
        participants_by_type:
          type: object
          additionalProperties:
            type: integer
        total_participants:
          type: integer
          minimum: 0
          default: 0

    ActiveRunResponse:
      type: object
      additionalProperties: false
      properties:
        api_version:
          type: string
          default: simulator-api/1
        run_id:
          type: string
          nullable: true

    AdminParticipantStatusChange:
      # 011/T1102. What `_set_participant_status` really emits (app/api/v1/admin.py:859,
      # returned unchanged at :876): exactly two keys, both always present, both non-null.
      # All four callers share this shape and differ only in the status literal they write -
      # freeze -> suspended (:892), unfreeze -> active (:912), ban -> deleted (:929),
      # unban -> active (:946). The pre-existing AdminParticipantStatusResponse cannot be
      # reused for ban: it permits only active|suspended, and ban writes deleted.
      type: object
      additionalProperties: false
      required: [pid, status]
      properties:
        pid:
          type: string
        status:
          type: string
          enum: [active, suspended, deleted]

    AdminParticipantStatusResponse:
      type: object
      required: [pid, status]
      properties:
        pid:
          type: string
        status:
          type: string
          enum: [active, suspended]
      additionalProperties: false

    AdminAbortTxResponse:
      type: object
      required: [tx_id, status]
      properties:
        tx_id:
          type: string
        status:
          type: string
          pattern: '^aborted$'
      additionalProperties: false

    AdminAuditLogItem:
      type: object
      required: [id, timestamp, action]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor_id:
          type: string
          nullable: true
        actor_role:
          type: string
          nullable: true
        action:
          type: string
        object_type:
          type: string
          nullable: true
        object_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        before_state:
          type: object
          nullable: true
          additionalProperties: true
        after_state:
          type: object
          nullable: true
          additionalProperties: true
        request_id:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true

    AdminAuditLogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLogItem'

    AdminMigrationsStatus:
      type: object
      required: [is_up_to_date]
      properties:
        current_revision:
          type: string
          nullable: true
        head_revision:
          type: string
          nullable: true
        is_up_to_date:
          type: boolean

    AdminEquivalentCreateRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/EquivalentCode'
        symbol:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        precision:
          type: integer
          default: 2
          minimum: 0
          maximum: 18
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        is_active:
          type: boolean
          default: true
        reason:
          type: string
          nullable: true

    AdminEquivalentUpdateRequest:
      type: object
      properties:
        symbol:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        precision:
          type: integer
          nullable: true
          minimum: 0
          maximum: 18
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        is_active:
          type: boolean
          nullable: true
        reason:
          type: string
          nullable: true

    AdminEquivalentUsageResponse:
      type: object
      required: [code, trustlines, debts, integrity_checkpoints]
      properties:
        code:
          type: string
        trustlines:
          type: integer
        debts:
          type: integer
        integrity_checkpoints:
          type: integer
      additionalProperties: false

    AdminDeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
      additionalProperties: false

    SignedRequest:
      type: object
      properties:
        signature:
          type: string
          description: base64 signature

    ChallengeRequest:
      type: object
      required: [pid]
