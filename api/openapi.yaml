          minimum: 0
      additionalProperties: false

    IntegrityAuditLogItem:
      # A projection of `integrity_audit_log`, NOT of `audit_log`: a different table, and six
      # keys against AdminAuditLogItem's thirteen. There is no `id`, no `actor_role`, no
      # `reason`, no `before_state`, no `request_id`, no `ip_address` and no `user_agent`, and
      # `after_state` here is a synthesised nine-key object rather than a stored snapshot - which
      # is why AdminAuditLogItem.after_state is in ACCEPTED_FREE_FORM and this one is not.
      # The two schemas must not be merged.
      #
      # All six keys are always on the wire: the handler assigns every field
      # (app/api/v1/integrity.py:497-516) and the route sets no response_model_exclude_none.
      type: object
      required: [timestamp, actor_id, action, object_type, object_id, after_state]
      properties:
        timestamp:
          # The one timestamp in this body that pydantic renders: the validator at
          # app/schemas/integrity.py:95-98 attaches UTC to the naive column value, so it goes out
          # as `...T12:00:00Z`. Every other instant in the same body - error_details.checked_at
          # and error_details.computed_at - is a string frozen by `.isoformat()` at write time
          # and ends in `+00:00`. Both are valid RFC 3339; one body, two spellings.
          type: string
          format: date-time
        actor_id:
          # Always null. The handler hard-codes `actor_id=None`
          # (app/api/v1/integrity.py:500) - the integrity trail records no actor, and the column
          # it would come from does not exist on integrity_audit_log. Contrast
          # AdminAuditLogItem.actor_id, which is a real column.
          type: string
          nullable: true
        action:
          # `f"integrity.{operation_type.lower()}"`, with INTEGRITY_VERIFY special-cased to
          # `integrity.verify` (app/api/v1/integrity.py:492-496) - so `integrity.integrity_verify`
          # is never emitted.
          type: string
          enum:
            - integrity.verify
            - integrity.trust_line_create
            - integrity.trust_line_update
            - integrity.trust_line_close
            - integrity.payment
            - integrity.clearing
            - integrity.simulator_audit_drift
        object_type:
          # The literal the handler writes on every row. Optional on the model, never null on
          # the wire.
          type: string
          enum: [equivalent]
        object_id:
          # `row.equivalent_code`, a NOT NULL column, so never null despite the Optional
          # annotation. Same value and same caveat as after_state.equivalent: not
          # EquivalentCode, because three writers can store a stringified UUID here.
          type: string
        after_state:
          $ref: '#/components/schemas/IntegrityAuditLogAfterState'

    IntegrityAuditLogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrityAuditLogItem'

    SimulatorVizSize:
      type: object
      required: [w, h]
      properties:
        w:
          type: number
        h:
          type: number
      additionalProperties: false

    SimulatorGraphNode:
      type: object
      required: [id]
