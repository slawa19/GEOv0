    IntegrityNetMutualDebtsRepairResponse:
      type: object
      required: [ok, action, netted_pairs, updated, deleted]
      properties:
        ok:
          type: boolean
          enum: [true]
        action:
          type: string
          enum: [net-mutual-debts]
        netted_pairs:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
      additionalProperties: false

    IntegrityCapDebtsRepairResponse:
      type: object
      required: [ok, action, scanned, updated, deleted]
      properties:
        ok:
          type: boolean
          enum: [true]
        action:
          type: string
          enum: [cap-debts-to-trust-limits]
        scanned:
