  /simulator/runs/{run_id}/artifacts/{name}:
    get:
      tags: [Simulator]
      summary: Download a specific artifact for a run (Real Mode control plane)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/ArtifactNamePath'
      responses:
        '200':
          # 011/T1110 (2026-08-24): this declared ONE media type, `application/octet-stream`, for
          # an operation that is not binary and never sends that type at all. The handler
          # (app/api/v1/simulator.py:2938) is `return FileResponse(path)` with no `media_type`, so
          # starlette sets it from `mimetypes.guess_type(name)` with `text/plain` as the fallback,
          # and `get_artifact_path` (app/core/simulator/artifacts.py:189) serves any file in the
          # run's artifacts directory. Everything the application writes there is listed below,
          # with the writer and the media type each one really arrives under - measured by driving
          # real `FileResponse` objects, not read off the helper.
          #
          #   status.json     artifacts.py:67 (init) and :343 (finalize)   application/json
          #   summary.json    artifacts.py:344                             application/json
          #   last_tick.json  artifacts.py:64 (init) and :361 (real tick)  application/json
          #   events.ndjson   artifacts.py:84, appended by the writer loop text/plain
          #   bundle.zip      artifacts.py:333 (on stop)                   application/zip
          #                                                                or application/x-zip-compressed
          #
          # Two of those deserve saying out loud, because they are the service disagreeing with
          # itself and the canon's job is to report that rather than tidy it away:
          #
          # * `events.ndjson` arrives as `text/plain`. `mimetypes` knows no `.ndjson`, so
          #   starlette falls back. The artifacts INDEX advertises `application/x-ndjson` for the
          #   same file (app/core/simulator/helpers.py:8, surfaced through ArtifactItem.content_type),
          #   so the index and the download do not agree. Declaring `application/x-ndjson` here
          #   would describe the index instead of this operation.
          # * `bundle.zip` arrives as `application/zip` or `application/x-zip-compressed`
          #   depending on the host's mimetypes database - the latter is what a Windows registry
          #   lookup returns, and it is what this repository's own test run produced. Both are
          #   declared because both really occur; the handler passing an explicit `media_type`
          #   would remove the fork, and that is an application change, not a canon one.
          description: |
            Artifact content. The media type follows the artifact's file name, because the
            handler returns a `FileResponse` with no explicit `media_type`.
          content:
            # status.json, summary.json and last_tick.json - and `oneOf` rather than
            # `type: object`, because "some object" is exactly the thing
            # `test_p011_success_responses_describe_their_content` forbids and it would leave the
            # body no better checked than the octet-stream it replaced. Four branches and not
            # three: `status.json` has TWO shapes over a run's life. `init_run_artifacts` writes
            # the small record below, and `finalize_run_artifacts` overwrites the same file on
            # stop with `get_run_status(run_id).model_dump(mode="json", by_alias=True)`
            # (app/core/simulator/runtime_impl.py:198 -> run_lifecycle.py:431 -> artifacts.py:343),
            # which is the very document `GET /simulator/runs/{run_id}` returns.
            #
            # The branches are mutually exclusive by construction - every one of them is
            # `additionalProperties: false` and no two share a key set - so `oneOf` is a true
            # "exactly one of these documents" and not a disguised `anyOf`.
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SimulatorArtifactStatusInit'
                  - $ref: '#/components/schemas/RunStatus'
                  - $ref: '#/components/schemas/SimulatorArtifactSummary'
                  - $ref: '#/components/schemas/SimulatorArtifactLastTick'
            # events.ndjson, and any artifact whose extension mimetypes cannot guess.
            text/plain:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
            application/x-zip-compressed:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/SimulatorIdentityUnprocessable'

