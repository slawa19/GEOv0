    SimulatorGraphLink:
      type: object
      required: [source, target]
      properties:
        id:
          type: string
          nullable: true
        source:
          type: string
        target:
          type: string
        # None of the three is ever null on the wire, so none of them carries a null branch.
        # The `nullable: true` that stood beside each `oneOf` was inert anyway - in OpenAPI 3.0.3
        # `nullable` modifies a sibling `type` and nothing else (`F-011-10`) - but it was also
        # untrue, on both schemas, for two different reasons.
        #
        # On the SNAPSHOT link: `scenario_to_snapshot` sets `used=0` unconditionally and takes
        # `trust_limit`/`available` from the scenario's `limit`
        # (app/core/simulator/snapshot_builder.py:373-384), and `limit` is `required` on every
        # trustline in fixtures/simulator/scenario.schema.json under
        # `anyOf: [integer, number, string]`, which rejects a missing key and an explicit null
        # alike - verified by feeding both through `validate_scenario_or_400`. Real mode then
        # overwrites all three with money strings (snapshot_builder.py:232-234).
        #
        # On the PATCH: there is no pydantic model at all, only two hand-built dicts.
        # `build_edge_patch_for_equivalent` sets all three to money strings
        # (app/core/simulator/edge_patch_builder.py:161-163); `build_edge_patch_for_pairs` sets
        # `used`/`available` and OMITS `trust_limit` entirely (edge_patch_builder.py:269-277).
        # Absent, or a value - never null.
        trust_limit:
          oneOf:
            - type: string
            - type: number
        used:
          oneOf:
            - type: string
            - type: number
        available:
          oneOf:
            - type: string
            - type: number
        status:
          type: string
          nullable: true
        viz_color_key:
          type: string
          nullable: true
        viz_width_key:
          type: string
          nullable: true
        viz_alpha_key:
          type: string
          nullable: true
      additionalProperties: true

