      properties:
        key:
          # One of the twelve runtime settings `_runtime_config_items` names
          # (app/api/v1/admin.py:261-276). That list is a literal, so the key set is closed - but
          # it is not enumerated here, so a new setting can appear without the canon going stale
          # in the same commit.
          type: string
        value:
          # 011/T1108: this said `description: Any JSON value` and nothing else, and the
          # undescribed-response guard passed it only because its rule was "is the dict empty"
          # rather than "is there a constraint here at all". The value is `getattr(settings, key)`
          # over that closed list of twelve, so it was never free form - it is a union of three
          # scalar types, measured on the real settings object: six booleans, five integers and
          # one string (LOG_LEVEL). Nothing on the list is a float, an array or an object.
          oneOf:
