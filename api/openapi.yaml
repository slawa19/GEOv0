  # Interact Mode control plane (011/T1101, published 2026-08-23).
  # These eight operations were registered and callable all along; only their schema
  # visibility was tied to SIMULATOR_ACTIONS_ENABLE, which gated nothing - the runtime
  # guard returns 403 ACTIONS_DISABLED independently of it. Errors here use the flat
  # SimulatorActionError envelope, not ErrorEnvelope: they are assembled by _action_error,
  # which returns a raw JSONResponse, so response_model of the route does not apply.

  /simulator/runs/{run_id}/actions/trustline-create:
    post:
      tags: [Simulator]
      summary: Create a trust line inside a run (Interact Mode)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatorActionTrustlineCreateRequest'
      responses:
        '200':
          description: Trust line created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionTrustlineCreateResponse'
        '400':
          $ref: '#/components/responses/SimulatorActionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SimulatorActionForbidden'
        '404':
          $ref: '#/components/responses/SimulatorActionNotFound'
        '409':
          $ref: '#/components/responses/SimulatorActionConflict'
        '422':
          $ref: '#/components/responses/SimulatorActionUnprocessable'
        '503':
          description: Action unavailable - RUN_PERIMETER_UNAVAILABLE, TRUSTLINE_USED_UNAVAILABLE or SEEDING_FAILED (flat envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorActionError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /simulator/runs/{run_id}/actions/trustline-update:
    post:
      tags: [Simulator]
      summary: Change the limit of a trust line inside a run (Interact Mode)
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
